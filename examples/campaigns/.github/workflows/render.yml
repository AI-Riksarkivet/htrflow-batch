name: Render
# Its Azure Pipelines sibling is azure-pipelines.yml
# (`htrflow-campaigns init --ci azure`): the same three steps with the same
# variables. Keep them in step.
#
# On a pull request: validate campaigns/ + pipelines/ + converter.yaml,
# nothing more — this never touches rendered/.
# On main: render and commit rendered/, so what `htrflow-campaigns apply`
# applies (as an Argo CD hook, or `make campaigns-apply` by hand) is always
# exactly what CI produced from the merged commit, never something rendered
# by hand on a laptop. Nothing else applies rendered/: every object in it is
# a Skip hook to Argo CD, and `kubectl apply` of it would re-create a
# finished campaign's reaped Job.
#
# What this workflow does NOT do: apply anything. It renders; something else
# applies. That something should be `htrflow-campaigns apply <repo> --prune`
# — the same converter, one command: it renders, applies pipelines then
# campaigns, prunes what a deleted campaign file left behind, and enforces
# `suspend:` on the Kueue Workload (the rendered `spec.suspend` alone does
# not hold, Kueue owns that field for a Workload it has admitted). It talks
# to the API server through the official Kubernetes client, so a runner or
# hook pod needs credentials (a kubeconfig, or a ServiceAccount token — the
# htrflow-batch chart renders one behind `apply.rbac.enabled`) but no
# `kubectl` binary. With Argo CD it is a PostSync hook — this repo's
# argocd/apply.yaml; by hand it is `make campaigns-apply DIR=<repo> PRUNE=1`.
#
# CI installs the converter as a plain Python package, with uvx straight
# from the htrflow-batch repo at CONVERTER_REF (see "Install the converter"
# below). An htrflow-batch release pins CONVERTER_REF to its own tag in the
# copy of this file it ships; the converter image exists only for the Argo
# CD hook (argocd/apply.yaml), which runs in the cluster.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # A released htrflow-batch tag (a release pins it here); a commit SHA also
  # works and is the most reproducible option. The Policy job checks the
  # chart out at this same ref, so the policies CI runs are the ones that
  # shipped with the converter that rendered.
  CONVERTER_REF: v0.5.0
  KYVERNO_VERSION: v1.19.0
  # The cluster's own htrflow-batch values, repeated here because CI has no
  # cluster to read them from (`helm get values <release> -n <namespace>`).
  # Keep them in step: CI can only run the policies it is told about, and
  # the cluster is the gate that actually holds.
  POLICY_NAMESPACE: htr-batch
  POLICY_ALLOWED_IMAGE_REPOS: "{docker.io/riksarkivet/}"
  POLICY_REQUIRE_MODEL_REVISION: "false"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the converter
        run: |
          uv tool install "git+https://github.com/AI-Riksarkivet/htrflow-batch@${CONVERTER_REF}#subdirectory=packages/converter"
      - name: Validate
        run: htrflow-campaigns validate .

  # The same Kyverno ClusterPolicies the cluster admits against, run over
  # this repo's rendered output before anything is applied: digest pins, the
  # image allow-list and (when the release requires it) a 40-hex revision on
  # every model. `htrflow-campaigns validate` no longer checks any of that —
  # it is cluster policy, and the cluster enforces it on everything it
  # admits, not only on what this repo rendered. Failing here means the
  # author sees the same sentence in the pull request that the API server
  # would have shown at apply time.
  #
  # The policies come from `helm template` of the chart at CONVERTER_REF
  # rather than a copy checked in here: a copy is a second source of truth
  # and it drifts silently. On a pull request `rendered/` is not written
  # (only main commits it), so this renders to a temp directory of its own.
  policy:
    name: Policy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AI-Riksarkivet/htrflow-batch
          ref: ${{ env.CONVERTER_REF }}
          path: .htrflow-batch
      - uses: astral-sh/setup-uv@v5
      - uses: azure/setup-helm@v5
      - name: Install the converter
        run: |
          uv tool install "git+https://github.com/AI-Riksarkivet/htrflow-batch@${CONVERTER_REF}#subdirectory=packages/converter"
      - name: Install the Kyverno CLI
        run: |
          curl -fsSL "https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kyverno
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kyverno" version
      - name: Render
        run: htrflow-campaigns render . --out "$RUNNER_TEMP/rendered"
      - name: Render the chart's policies
        run: |
          helm template htrflow-batch .htrflow-batch/charts/htrflow-batch \
            -n "$POLICY_NAMESPACE" \
            --set publicResultsBase=http://ci.invalid/ \
            --set network.enabled=false \
            --set security.policies.enabled=true \
            --set "security.allowedImageRepos=$POLICY_ALLOWED_IMAGE_REPOS" \
            --set "security.requireModelRevision=$POLICY_REQUIRE_MODEL_REVISION" \
            --show-only 'templates/policies/*.yaml' > "$RUNNER_TEMP/policies.yaml"
      - name: Kyverno
        # One file, not one --resource per directory: `kyverno apply` v1.19
        # honours a single --resource, so a second one is silently dropped
        # and half the manifests go unchecked. The `---` keeps the documents
        # of two files from merging into one.
        #
        # `--userinfo` says who is asking. The rbac-scope policy holds each
        # ServiceAccount to its own objects, so it matches on the requester;
        # with no requester the CLI cannot rule the web identity out, and
        # that rule refuses every pipeline and campaign ConfigMap. What this
        # repo renders reaches the cluster through `htrflow-campaigns apply`,
        # so the check submits as the ServiceAccount the chart creates for
        # it (`apply.rbac`). An operator's own kubeconfig is no different
        # here: neither is the web identity, and a rule scoped to the apply
        # identity only ever matches a delete, which this check never makes.
        run: |
          for f in "$RUNNER_TEMP"/rendered/*/*.yaml; do echo '---'; cat "$f"; done \
            > "$RUNNER_TEMP/all.yaml"
          cat > "$RUNNER_TEMP/userinfo.yaml" <<EOF
          apiVersion: cli.kyverno.io/v1alpha1
          kind: UserInfo
          metadata:
            name: htrflow-campaigns-apply
          userInfo:
            username: system:serviceaccount:${POLICY_NAMESPACE}:htrflow-campaigns
          EOF
          kyverno apply "$RUNNER_TEMP/policies.yaml" --resource "$RUNNER_TEMP/all.yaml" \
            --userinfo "$RUNNER_TEMP/userinfo.yaml"

  render:
    name: Render and commit rendered/
    needs: [validate, policy]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install the converter
        run: |
          uv tool install "git+https://github.com/AI-Riksarkivet/htrflow-batch@${CONVERTER_REF}#subdirectory=packages/converter"
      - name: Render
        run: htrflow-campaigns render . --out rendered
      - name: Commit rendered/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rendered
          git diff --cached --quiet && exit 0
          git commit -m "render: $(git rev-parse --short HEAD)"
          git push

