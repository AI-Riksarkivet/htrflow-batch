# A pipeline id names the FULL recipe: this image digest AND these steps,
# together. Never edit this file in place once a campaign has run against
# it — mint demo-v2.yaml instead (see the append-only / immutability
# sections of ../README.md and htrflow-batch's
# docs/reference/campaign-yaml.md#immutability).
image: docker.io/riksarkivet/htrflow-batch@sha256:2a556545a3623a5036416a86b8eb02b6e093ccc92f3e347b788360ff80bd119d
# Regions first, then the lines within them: ALTO and PAGE XML hold the text
# of lines inside a region only, so a reader with one Segmentation step
# before it would publish every page empty (validate refuses that shape).
steps:
  - step: Segmentation
    settings:
      model: yolo
      model_settings:
        model: Riksarkivet/yolov9-regions-1
  - step: Segmentation
    settings:
      model: yolo
      model_settings:
        model: Riksarkivet/yolov9-lines-within-regions-1
  - step: TextRecognition
    settings:
      model: TrOCR
      model_settings:
        model: Riksarkivet/trocr-base-handwritten-hist-swe-2
