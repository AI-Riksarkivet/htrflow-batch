
# ---------------------------------------------------------------------------
# Everything above is AI-Riksarkivet/htrflow's pyproject.toml at HTRFLOW_REF,
# byte for byte; everything below is this repository's, appended by
# `make lock-htrflow-base` from .docker/htrflow-base/overlay.toml. The image
# build refuses a pyproject.toml whose first part is not the pinned
# checkout's, so the lock cannot drift from the source it installs.
#
# torch and torchvision from PyPI on both architectures, locked with hashes
# (finding 3060), one release on both. PyPI's wheels bundle CUDA 13 and carry
# kernels for sm_75 through sm_120, Blackwell included, for torch AND
# torchvision. The cu129 builds from PyTorch's index, used here before, are
# not one build: their torch carries sm_120, their torchvision stops at sm_90,
# so every torchvision op (YOLO's NMS) failed on a Blackwell card with "no
# kernel image is available". CUDA 13 needs a 580+ driver on every GPU node;
# the image build checks that torchvision covers each architecture torch
# does (.docker/check_cuda_archs.py). 2.13.0/0.28.0 is the release with no
# open advisory.
[tool.uv]
environments = ["sys_platform == 'linux'"]
constraint-dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
]
