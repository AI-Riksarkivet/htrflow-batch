[project]
name = "htrflow"
version = "0.2.6"
description = "htrflow is developed at Riksarkivet's AI-lab as an open-source package to simplify HTR"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{email = "ai@riksarkivet.se"}]
keywords = ["htr", "htrflow", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10,<3.14"

dependencies = [
    "jinja2 >= 3.1.5",
    "numpy",
    "opencv-python-headless >=4.11.0.86",
    "tqdm >=4.66.2,<5",
    "xmlschema >=3.0.2,<4",
    "typer>=0.12.0",
    "rich >=13.7.1",
    "jiwer >=4.0",
    "transformers >=4.47",
    "torch >= 2.6",
    "huggingface-hub[cli] >=0.28.1",
    "ultralytics >=8.3.74",
    "pydantic>=2.10.6",
]

[project.urls]
Documentation = "https://ai-riksarkivet.github.io/htrflow"
Repository = "https://github.com/AI-Riksarkivet/htrflow"


[project.scripts]
htrflow = "htrflow.cli:app"


[dependency-groups]
dev = [
    "pytest >=8.0.1",
    "pytest-cov >=4.1.0",
    "pytest-github-actions-annotate-failures >=0.2.0",
    "python-dotenv >=1.0.1",
    "ruff >=0.6.2",
    "uv>=0.4.12",
    "tox-uv>=1.13.0",
]

[project.optional-dependencies]
docs = [
    "mike >=2.1.1",
    "mkdocs-jupyter >=0.24.6",
    "mkdocs-material >=9.5.10",
    "mkdocstrings[python] >=0.20",
    "mkdocs-table-reader-plugin >=2.2.2",
    "mkdocs-git-revision-date-localized-plugin >=1.2.6",
    "termynal >=0.12.1",
    "mkdocs-swagger-ui-tag >=0.6.10"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow"]

[tool.hatch.metadata]
allow-direct-references = true  

[tool.pytest.ini_options]
addopts = "-v --cov htrflow --cov-report term-missing --no-cov-on-fail"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as gpu (deselect with '-m \"not gpu\"')",
    "teklia: marks tests as teklia (deselect with '-m \"not teklia\"')"
]
pythonpath = "src"
testpaths = ["tests/unit", "tests/integration"]

[tool.coverage.run]
source = ["src/htrflow"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
]

# Formatting and linting (tool.ruff)
[tool.ruff]
line-length = 119
target-version = "py310"
exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["C901", "E741", "W605"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]
# Disable line length limit in cli.py. This allows Typer CLI arguments
# and their documentation to use one line each, increasing readability.
"cli.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["htrflow"]
lines-after-imports = 2

# ---------------------------------------------------------------------------
# Everything above is AI-Riksarkivet/htrflow's pyproject.toml at HTRFLOW_REF,
# byte for byte; everything below is this repository's, appended by
# `make lock-htrflow-base` from .docker/htrflow-base/overlay.toml. The image
# build refuses a pyproject.toml whose first part is not the pinned
# checkout's, so the lock cannot drift from the source it installs.
#
# torch per architecture, both locked with hashes (finding 3060). x86_64:
# the cu128 builds from PyTorch's index, which carry Blackwell (sm_120)
# kernels and run on the drivers the CUDA 12 line supports; 2.9.1/0.24.1
# is what the wrapper image has shipped since it swapped torch. aarch64:
# PyPI's wheels, which bundle CUDA 13; 2.13.0/0.28.0 is what the GB10 base
# was locked to.
[tool.uv]
environments = ["sys_platform == 'linux'"]
constraint-dependencies = [
    "torch==2.9.1; platform_machine == 'x86_64'",
    "torchvision==0.24.1; platform_machine == 'x86_64'",
    "torch==2.13.0; platform_machine == 'aarch64'",
    "torchvision==0.28.0; platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" }]
torchvision = [{ index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" }]
