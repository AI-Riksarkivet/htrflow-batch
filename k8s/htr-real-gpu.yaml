# Real htrflow image on a real GPU (Blackwell) through Kueue
apiVersion: v1
kind: ConfigMap
metadata:
  name: htr-real-gpu
  namespace: htr-batch
data:
  pipeline.yaml: |
    steps:
    - step: Segmentation
      settings:
        model: yolo
        model_settings:
          model: Riksarkivet/yolov9-regions-1
        generation_settings:
          batch_size: 4
    - step: Segmentation
      settings:
        model: yolo
        model_settings:
          model: Riksarkivet/yolov9-lines-within-regions-1
        generation_settings:
          batch_size: 4
    - step: TextRecognition
      settings:
        model: TrOCR
        model_settings:
          model: Riksarkivet/trocr-base-handwritten-hist-swe-2
        generation_settings:
          batch_size: 16
          num_beams: 1
    - step: Export
      settings:
        dest: /data/outputs/vol-201/alto
        format: alto
  run.sh: |
    set -euo pipefail
    echo "== torch device check =="
    python - <<'PY'
    import torch
    print("cuda available:", torch.cuda.is_available())
    if torch.cuda.is_available():
        print("device:", torch.cuda.get_device_name(0), "capability:", torch.cuda.get_device_capability(0))
    PY
    mkdir -p /work/input
    python - <<'PY'
    import urllib.request
    base = "https://huggingface.co/spaces/Riksarkivet/htr_demo/resolve/main/.gradio_cache/examples"
    for i, name in enumerate(["A0062408_00006.jpg", "A0073477_00025.jpg"], start=1):
        urllib.request.urlretrieve(f"{base}/{name}", f"/work/input/{i:04d}.jpg")
        print("fetched", name)
    PY
    echo "== running htrflow (GPU) =="
    time htrflow pipeline /config/pipeline.yaml /work/input --logfile /dev/stdout
    echo "== verify (D8) =="
    n=$(find /data/outputs/vol-201/alto -name '*.xml' | wc -l)
    [ "$n" -eq 2 ] || { echo "VERIFY FAILED: $n/2"; exit 1; }
    echo "VERIFY OK: $n/2 pages"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: htr-vol-201
  namespace: htr-batch
  labels:
    app: htrflow-batch
    batch.htrflow/volume: vol-201
    kueue.x-k8s.io/queue-name: htr-batch
spec:
  suspend: true
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels: { app: htrflow-batch }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: htrflow
          image: 127.0.0.1:30500/htrflow-batch:cu128   # in-cluster registry; stock image + torch cu128 (Blackwell)
          imagePullPolicy: IfNotPresent
          command: ["bash", "/config/run.sh"]
          env:
            - name: HF_HOME
              value: /data/hf
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: work
              mountPath: /work
          resources:
            requests: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
      volumes:
        - name: config
          configMap: { name: htr-real-gpu }
        - name: data
          persistentVolumeClaim: { claimName: htr-test-data }
        - name: work
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
