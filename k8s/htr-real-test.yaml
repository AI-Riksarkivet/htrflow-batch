# Real htrflow image, CPU-only smoke test (DESIGN.md §13 follow-up)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: htr-test-data
  namespace: htr-batch
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: htr-real-test
  namespace: htr-batch
data:
  pipeline.yaml: |
    # CPU-friendly minimal pipeline: regions -> lines -> TrOCR -> export
    steps:
    - step: Segmentation
      settings:
        model: yolo
        model_settings:
          model: Riksarkivet/yolov9-regions-1
        generation_settings:
          batch_size: 1
    - step: Segmentation
      settings:
        model: yolo
        model_settings:
          model: Riksarkivet/yolov9-lines-within-regions-1
        generation_settings:
          batch_size: 1
    - step: TextRecognition
      settings:
        model: TrOCR
        model_settings:
          model: Riksarkivet/trocr-base-handwritten-hist-swe-2
        generation_settings:
          batch_size: 2
          num_beams: 1
    - step: Export
      settings:
        dest: /data/outputs/vol-101/alto
        format: alto
  run.sh: |
    set -euo pipefail
    echo "== torch device check =="
    python - <<'PY'
    import torch
    print("cuda available:", torch.cuda.is_available())
    PY
    mkdir -p /work/input
    echo "== fetching pages (htr_demo images) =="
    python - <<'PY'
    import urllib.request
    base = "https://huggingface.co/spaces/Riksarkivet/htr_demo/resolve/main/.gradio_cache/examples"
    for i, name in enumerate(["A0062408_00006.jpg", "A0073477_00025.jpg"], start=1):
        urllib.request.urlretrieve(f"{base}/{name}", f"/work/input/{i:04d}.jpg")
        print("fetched", name)
    PY
    echo "== running htrflow (CPU) =="
    time htrflow pipeline /config/pipeline.yaml /work/input --logfile /dev/stdout
    echo "== outputs =="
    find /data/outputs/vol-101 -type f | sort
    echo "== verify (D8): expect 2 ALTO files =="
    n=$(find /data/outputs/vol-101/alto -name '*.xml' | wc -l)
    [ "$n" -eq 2 ] || { echo "VERIFY FAILED: $n/2"; exit 1; }
    echo "== ALTO sample (first 400 chars of text content) =="
    head -c 2000 "$(find /data/outputs/vol-101/alto -name '*.xml' | head -1)"
    echo; echo "VERIFY OK: $n/2 pages"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: htr-vol-101
  namespace: htr-batch
  labels:
    app: htrflow-batch
    batch.htrflow/volume: vol-101
    kueue.x-k8s.io/queue-name: htr-batch
spec:
  suspend: true
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels: { app: htrflow-batch }
    spec:
      restartPolicy: Never
      containers:
        - name: htrflow
          image: airiksarkivet/htrflow:v0.2.6-35f48a7
          command: ["bash", "/config/run.sh"]
          env:
            - name: HF_HOME
              value: /data/hf
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
            - name: work
              mountPath: /work
          resources:
            requests: { cpu: "4", memory: 6Gi }
            limits: { cpu: "4", memory: 12Gi }
      volumes:
        - name: config
          configMap: { name: htr-real-test }
        - name: data
          persistentVolumeClaim: { claimName: htr-test-data }
        - name: work
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
