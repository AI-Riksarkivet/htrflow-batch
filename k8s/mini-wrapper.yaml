apiVersion: v1
kind: ConfigMap
metadata:
  name: mini-wrapper
  namespace: htr-batch
data:
  batch_run.py: |
    """Miniature of the htrflow-batch wrapper (DESIGN.md §5.1) for the Kueue smoke test.
    Real page downloads (HF demo images), simulated HTR, streaming per-page upload,
    verify gate, manifest.json last."""
    import json, os, time, urllib.request
    import boto3

    VOLUME_REF = os.environ["VOLUME_REF"]
    PIPELINE_ID = os.environ.get("PIPELINE_ID", "demo-v0")
    PAGE_URLS = os.environ["PAGE_URLS"].split()
    SECS_PER_PAGE = float(os.environ.get("SECS_PER_PAGE", "20"))
    PREFIX = f"{PIPELINE_ID}/{VOLUME_REF}"

    s3 = boto3.client(
        "s3",
        endpoint_url=os.environ["S3_ENDPOINT"],
        aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
        aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"],
    )
    bucket = os.environ["S3_BUCKET"]

    t0 = time.time()
    # resume check: which pages already have ALTO?
    done = set()
    resp = s3.list_objects_v2(Bucket=bucket, Prefix=f"{PREFIX}/alto/")
    for o in resp.get("Contents", []):
        done.add(o["Key"].rsplit("/", 1)[-1].removesuffix(".xml"))
    print(f"[{VOLUME_REF}] resume: {len(done)} pages already done", flush=True)

    stall = 0.0
    results = {}
    for i, url in enumerate(PAGE_URLS, start=1):
        page = f"{i:04d}"
        if page in done:
            results[page] = "skipped"
            continue
        td = time.time()
        img = urllib.request.urlopen(url, timeout=60).read()   # "IIIF fetch"
        stall += time.time() - td                              # download not overlapped in mini version
        time.sleep(SECS_PER_PAGE)                              # "HTR" (GPU stand-in)
        alto = f'<?xml version="1.0"?><alto><page id="{page}" bytes="{len(img)}" src="{url}"/></alto>'
        s3.put_object(Bucket=bucket, Key=f"{PREFIX}/alto/{page}.xml", Body=alto.encode())  # streaming upload
        results[page] = "ok"
        print(f"[{VOLUME_REF}] page {page}: {len(img)}B -> alto uploaded", flush=True)

    # verify gate (D8): every page accounted for
    resp = s3.list_objects_v2(Bucket=bucket, Prefix=f"{PREFIX}/alto/")
    uploaded = {o["Key"].rsplit("/", 1)[-1].removesuffix(".xml") for o in resp.get("Contents", [])}
    expected = {f"{i:04d}" for i in range(1, len(PAGE_URLS) + 1)}
    missing = expected - uploaded
    if missing:
        with open("/dev/termination-log", "w") as f:
            json.dump({"stage": "verify", "missing": sorted(missing)}, f)
        raise SystemExit(1)  # transient -> Job retry + resume

    manifest = {
        "volume": VOLUME_REF, "pipeline": PIPELINE_ID,
        "pages": len(PAGE_URLS), "results": results,
        "wall_seconds": round(time.time() - t0, 1),
        "gpu_stall_seconds": round(stall, 1),
    }
    s3.put_object(Bucket=bucket, Key=f"{PREFIX}/manifest.json", Body=json.dumps(manifest).encode())
    print(f"[{VOLUME_REF}] COMPLETE {manifest}", flush=True)
