# UV4 viewer (D19) — static nginx site on NodePort 30800.
# Open a volume with:
#   http://10.16.51.53:30800/uv.html#?manifest=<PUBLIC_RESULTS_BASE>/<pipeline>/<volume>/iiif.json
# Convenience: / redirects to the demo mock-vol (terminal-clicked long URLs lose
# the #fragment, showing an empty viewer — the short URL avoids that).
apiVersion: v1
kind: ConfigMap
metadata:
  name: uv4-viewer-nginx
  namespace: htr-batch
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;
      absolute_redirect off;  # keep Location relative so the NodePort survives
      location = / {
        # localhost so the demo works over `ssh -L` (published iiif.json rewritten to match);
        # on-LAN browsers would need the node IP instead — PoC access path is ssh-only
        return 302 /uv.html#?manifest=http://localhost:30900/htr-results/demo-v1/mock-vol/iiif.json;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uv4-viewer
  namespace: htr-batch
  labels: { app: uv4-viewer }
spec:
  replicas: 1
  selector:
    matchLabels: { app: uv4-viewer }
  template:
    metadata:
      labels: { app: uv4-viewer }
    spec:
      containers:
        - name: nginx
          image: 127.0.0.1:30500/uv4:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: uv4-viewer-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: uv4-viewer
  namespace: htr-batch
  labels: { app: uv4-viewer }
spec:
  type: NodePort
  selector: { app: uv4-viewer }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30800
