apiVersion: batch/v1
kind: Job
metadata:
  name: htr-vol-007
  namespace: htr-batch
  labels:
    app: htrflow-batch
    batch.htrflow/volume: vol-007
    kueue.x-k8s.io/queue-name: htr-batch
spec:
  suspend: true
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: htrflow-batch }
    spec:
      restartPolicy: Never
      containers:
        - name: wrapper
          image: python:3.12-slim
          command: ["bash", "-c", "pip install -q boto3 && python /app/batch_run.py"]
          env:
            - name: VOLUME_REF
              value: vol-007
            - name: PIPELINE_ID
              value: demo-v0
            - name: PAGE_URLS
              value: "https://huggingface.co/spaces/Riksarkivet/htr_demo/resolve/main/.gradio_cache/examples/A0062408_00006.jpg https://huggingface.co/spaces/Riksarkivet/htr_demo/resolve/main/.gradio_cache/examples/A0070302_00201.jpg https://huggingface.co/spaces/Riksarkivet/htr_demo/resolve/main/.gradio_cache/examples/A0073477_00025.jpg https://huggingface.co/spaces/Riksarkivet/htr_demo/resolve/main/.gradio_cache/examples/R0003364_00005.jpg"
            - name: SECS_PER_PAGE
              value: "20"
          envFrom:
            - secretRef: { name: htr-batch-s3 }
          volumeMounts:
            - name: app
              mountPath: /app
          resources:
            requests: { cpu: "1", memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: app
          configMap: { name: mini-wrapper }
