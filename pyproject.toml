[project]
name = "htrflow-batch-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false          # virtual root: nothing to build, members do the work

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "ty",
    "moto[s3]>=5",
]
