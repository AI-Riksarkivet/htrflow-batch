[project]
name = "htrflow-batch-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false          # virtual root: nothing to build, members do the work

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages/wrapper/tests", "packages/reconciler/tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "ty",
    "moto[s3]>=5",
    "pillow>=12.3.0",
]
