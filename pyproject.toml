[project]
name = "htrflow-batch-workspace"
version = "0.0.0"
license = "EUPL-1.2"
requires-python = ">=3.10"

[tool.uv]
package = false          # virtual root: nothing to build, members do the work
# The two transformers lines the wrapper image can carry (the groups at the
# end of this file) cannot resolve together, so the lock forks for them.
conflicts = [
    [{ group = "transformers-4" }, { group = "transformers-5" }],
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "packages/wrapper/tests",
    "packages/converter/tests",
    "packages/web/tests",
]
markers = [
    "htrflow: needs the htrflow runtime; runs inside the wrapper image (make test-driver-real / dagger call test-driver)",
]
# fastapi.testclient's TestClient still wires up httpx (starlette is nudging
# everyone toward a hypothetical "httpx2"); nothing to act on here, just
# quiets the noise (packages/web/tests).
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

# Root ruff config governs everything outside packages/* (scripts/, the
# dagger module has no Python). Same rules as the members so `ruff check .`
# from the root is one consistent gate. docs/ is excluded: ruff formats
# fenced code in Markdown, and the plans under docs/superpowers are
# scaffolding, not source (audit T11/T14).
[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "ty",
    "moto[s3]>=5",
    "pillow>=12.3.0",
    "httpx>=0.27",
]
docs = [
    "zensical==0.0.62",
]
# git-cliff writes a GitHub release's notes from the conventional commits
# since the previous tag (cliff.toml, .github/workflows/release.yml).
release = [
    "git-cliff==2.14.2",
]
wrapper-image = [
    "brotli>=1.2.0",
    "pillow>=12.3.0",
]
# The transformers line of the wrapper image, one group per line: the image's
# TRANSFORMERS_VERSION build arg selects the group by its major version and
# installs its locked, hashed closure (.docker/htrflow-batch.dockerfile), so
# nothing in that step is resolved at build time. A version the build asks for
# must be the one pinned here. protobuf and sentencepiece belong to the line:
# transformers needs them to load and convert slow tokenizers.
transformers-4 = [
    "transformers==4.57.6",
    "protobuf==7.36.1",
    "sentencepiece==0.2.2; platform_machine == 'aarch64'",
]
transformers-5 = [
    "transformers==5.9.0",
    "protobuf==7.36.1",
    "sentencepiece==0.2.2; platform_machine == 'aarch64'",
]
