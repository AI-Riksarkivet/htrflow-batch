[project]
name = "htrflow-api"
version = "0.1.0"
description = "Read-only /api/v1/jobs projection of Indexed Jobs (docs: docs/superpowers/specs/2026-09-01-indexed-jobs-design.md D8)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kubernetes>=29",
]

[project.scripts]
htrflow-api = "htrflow_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow_api"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
# fastapi.testclient's TestClient still wires up httpx (starlette is nudging
# everyone toward a hypothetical "httpx2"); nothing to act on here, just
# quiets the noise.
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
