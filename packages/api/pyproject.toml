[project]
name = "htrflow-api"
version = "0.13.1"
license = "EUPL-1.2"
description = "The campaigns API: checks the sign-in token of each request and answers the htrflow-campaigns CLI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.13.5",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.15.1",
]

[project.scripts]
htrflow-api = "htrflow_api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow_api"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
# fastapi.testclient's TestClient still wires up httpx (starlette is nudging
# everyone toward a hypothetical "httpx2"); nothing to act on here, just
# quiets the noise.
filterwarnings = ["ignore::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
