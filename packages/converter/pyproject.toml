[project]
name = "htrflow-converter"
version = "0.5.0"
license = "EUPL-1.2"
description = "Campaign/pipeline YAML -> manifests (docs: docs/superpowers/specs/2026-09-01-indexed-jobs-design.md)"
requires-python = ">=3.10"
dependencies = [
    # `apply` talks to the API server directly (server-side apply, our own
    # selector prune, the Kueue pause patch) -- one client library and one
    # auth path across the repo (packages/web pins the same range).
    "kubernetes>=29",
    "pydantic>=2.13.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The Argo CD hook's clone step (template/argocd/apply.yaml): pure-Python git,
# so the converter image needs no git binary and no shell.
hook = ["dulwich>=1.2"]

[project.scripts]
htrflow-campaigns = "htrflow_converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow_converter"]
# render.py reads these skeletons at runtime via importlib.resources, so they
# must ship in the wheel -- pinned explicitly rather than relying on
# hatchling's default non-.py inclusion (test_packaging.py verifies this).
# `init`'s template/ and ci/ (the CI flavours it lays over the template)
# need the same treatment, dotfiles included: `**` here does carry
# ci/github/.github/workflows/render.yml into both the sdist and the wheel
# (verified by hand -- unzip -l the built wheel -- and pinned by
# test_packaging.py's own template test).
artifacts = [
    "src/htrflow_converter/manifests/*.yaml",
    "src/htrflow_converter/template/**",
    "src/htrflow_converter/ci/**",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
