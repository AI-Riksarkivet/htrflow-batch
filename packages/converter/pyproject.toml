[project]
name = "htrflow-converter"
version = "0.1.0"
description = "Campaign/pipeline YAML -> manifests (docs: docs/superpowers/specs/2026-09-01-indexed-jobs-design.md)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
htrflow-campaigns = "htrflow_converter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow_converter"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
