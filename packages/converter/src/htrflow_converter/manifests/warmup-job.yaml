apiVersion: batch/v1
kind: Job
metadata:
  name: WARMUP
  namespace: NAMESPACE
  labels:
    app: htrflow-warmup
    htrflow.riksarkivet.se/managed-by: converter
    htrflow.riksarkivet.se/pipeline: PIPELINE
spec:
  backoffLimit: 2
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
    - action: FailJob
      onExitCodes:
        containerName: warmup
        operator: In
        values:
        - 13
  template:
    metadata:
      labels:
        app: htrflow-warmup
    spec:
      restartPolicy: Never
      # The download budget, on the POD and not on the Job. A Job-level
      # activeDeadlineSeconds is enforced by the Job controller, which
      # deletes the pod it kills -- taking the `{stage: "warmup", permanent,
      # error}` termination message with it, and that message is the only
      # place a warm-up failure reaches a person (the Job mounts no S3
      # secret, so there is no run log). On the pod template the kubelet
      # kills it instead: the pod survives with status.reason=
      # DeadlineExceeded and exit 143, the message is readable, and the
      # attempt is counted -- so a warm-up that ran out of time on a slow
      # first download is retried under `backoffLimit: 2` rather than
      # terminally failed on the first try. Same rule, same reasoning as
      # campaign-job.yaml.
      activeDeadlineSeconds: 3600
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: warmup
        image: IMAGE
        command:
        - /bin/sh
        - -c
        # Same prologue as the campaign Job (see campaign-job.yaml), plus
        # HF_HOME: this is the one pod that mounts the cache PVC read-write,
        # and a fresh volume has no /data/hf yet.
        args:
        - |
          set -eu
          mkdir -p "$HOME" "$TMPDIR" "$YOLO_CONFIG_DIR" "$HF_HOME"
          exec python -m htrflow_batch.warmup
        env:
        - name: PIPELINE_PATH
          value: /config/pipeline.yaml
        - name: PIPELINE_ID
          value: PIPELINE
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: HF_HOME
          value: /data/hf
        - name: WORKDIR_PATH
          value: /work
        - name: HOME
          value: /work/home
        - name: TMPDIR
          value: /work/tmp
        - name: YOLO_CONFIG_DIR
          value: /work/ultralytics
        volumeMounts:
        - name: pipeline
          mountPath: /config
        - name: data
          mountPath: /data
        - name: work
          mountPath: /work
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 8Gi
      volumes:
      - name: pipeline
        configMap:
          name: PIPELINE-CONFIGMAP
      - name: data
        persistentVolumeClaim:
          claimName: DATA_PVC
      - name: work
        emptyDir:
          sizeLimit: 4Gi
