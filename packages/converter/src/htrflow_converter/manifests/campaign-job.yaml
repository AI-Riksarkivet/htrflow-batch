apiVersion: batch/v1
kind: Job
metadata:
  name: CAMPAIGN
  namespace: NAMESPACE
  labels:
    app: htrflow-batch
    htrflow.riksarkivet.se/managed-by: converter
    htrflow.riksarkivet.se/campaign: CAMPAIGN
    htrflow.riksarkivet.se/pipeline: PIPELINE
    kueue.x-k8s.io/queue-name: QUEUE
  annotations:
    # A Skip hook to Argo CD: an Application syncing rendered/ never applies,
    # re-creates or prunes this object. `htrflow-campaigns apply` is the one
    # thing that applies it -- the finished-campaign guard, the live-record
    # check and the pause sync live there, and a Job Argo CD re-created
    # after its TTL would run every volume again.
    argocd.argoproj.io/hook: Skip
spec:
  suspend: false
  completionMode: Indexed
  completions: 1
  parallelism: 1
  backoffLimitPerIndex: 3
  maxFailedIndexes: 1
  # Rules are evaluated in order and the first match wins, so the disruption
  # Ignore stays at the top: a preempted or drained pod is not a failure of
  # this index. The two exit-13 rules below are per container and cannot both
  # match one pod.
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
    - action: FailIndex
      onExitCodes:
        containerName: wrapper
        operator: In
        values:
        - 13
    # The init container gave up waiting for the pipeline's warm-up marker
    # (render.py's `_WARMUP_WAIT`). Retrying is another `warmup_wait_seconds`
    # of held GPU for a marker that is not coming, so the index fails now.
    - action: FailIndex
      onExitCodes:
        containerName: warmup-wait
        operator: In
        values:
        - 13
  # How long the finished Job stays, rendered from the pipeline's
  # `ttl_seconds_after_finished:` or converter.yaml's default. A window for
  # looking at `completedIndexes`, not the campaign's record: that is the
  # campaign's ConfigMap, which has no TTL at all (B76).
  ttlSecondsAfterFinished: 0
  template:
    metadata:
      labels:
        app: htrflow-batch
    spec:
      restartPolicy: Never
      # The per-volume wall-clock budget, rendered from the pipeline's
      # `max_seconds:` or converter.yaml's default. The kubelet enforces it, so
      # the wrapper needs no watchdog thread of its own: at the deadline it is
      # SIGTERMed, writes its termination message and exits 143. Verified on
      # k3s v1.35.5 (2026-09-02): a deadline kill leaves status.reason=
      # DeadlineExceeded, exit code 143 and NO DisruptionTarget condition, so
      # the Ignore rule above does not swallow it -- the attempt is counted and
      # backoffLimitPerIndex retries the index, resuming from published pages.
      activeDeadlineSeconds: 0
      # The wrapper's SIGTERM path (join the log-shipping thread, then one
      # final run-log PUT through a bounded S3 client) can take ~100 s on a
      # slow endpoint; the default 30 s would SIGKILL the pod mid-cleanup and
      # lose both the complete run log and the clean exit 143.
      terminationGracePeriodSeconds: 120
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: wrapper
        image: IMAGE
        command:
        - /bin/sh
        - -c
        # The mkdir is the prologue's job, not the wrapper's: under
        # readOnlyRootFilesystem HOME/TMPDIR/YOLO_CONFIG_DIR (set below, into
        # the tmpfs `work` mount) are the only places htrflow's stack may
        # write outside HF_HOME -- ultralytics settings, triton/inductor JIT
        # caches under HOME, temp files -- and they must exist before any
        # model is built. Comments live out here so they do not ship inside
        # every rendered Job's shell script.
        args:
        - |
          set -eu
          mkdir -p "$HOME" "$TMPDIR" "$YOLO_CONFIG_DIR"
          line=$(sed -n "$((JOB_COMPLETION_INDEX + 1))p" /campaign/volumes.txt)
          [ -n "$line" ] || { echo "no volume for index $JOB_COMPLETION_INDEX" >&2; exit 13; }
          id=${line%%	*}; src=${line#*	}
          export VOLUME_REF="$id"
          case "$src" in images:*) export IMAGES="${src#images:}" ;; *) export IIIF_MANIFEST_URL="$src" ;; esac
          exec python -m htrflow_batch
        env:
        - name: PIPELINE_PATH
          value: /config/pipeline.yaml
        - name: PIPELINE_ID
          value: PIPELINE
        - name: S3_PREFIX
          value: ""
        - name: PUBLIC_RESULTS_BASE
          value: ""
        - name: IMAGE_DIGEST
          value: IMAGE
        - name: HF_HUB_OFFLINE
          value: "1"
        # Which attempt of its index this pod is, and how many the index
        # gets: the wrapper fails a page it still defers on the last one.
        # The Job controller sets the annotation on every pod of an Indexed
        # Job with backoffLimitPerIndex (absent reads as "", which the
        # wrapper takes as 0); render.py copies the limit from
        # spec.backoffLimitPerIndex above, so the two cannot drift.
        - name: INDEX_FAILURE_COUNT
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['batch.kubernetes.io/job-index-failure-count']
        - name: BACKOFF_LIMIT_PER_INDEX
          value: "0"
        - name: MANIFEST_MAX_BYTES
          value: "0"
        - name: FETCH_MAX_BYTES
          value: "0"
        - name: HF_HOME
          value: /data/hf
        - name: WORKDIR_PATH
          value: /work
        - name: HOME
          value: /work/home
        - name: TMPDIR
          value: /work/tmp
        - name: YOLO_CONFIG_DIR
          value: /work/ultralytics
        - name: AWS_SHARED_CREDENTIALS_FILE
          value: /secrets/s3/credentials
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: S3_SECRET
              key: S3_ENDPOINT
              optional: true
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: S3_SECRET
              key: S3_BUCKET
        volumeMounts:
        - name: campaign
          mountPath: /campaign
          readOnly: true
        - name: pipeline
          mountPath: /config
        - name: data
          mountPath: /data
          readOnly: true
        - name: work
          mountPath: /work
        - name: s3
          mountPath: /secrets/s3
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: 16Gi
            nvidia.com/gpu: "1"
      volumes:
      - name: campaign
        configMap:
          name: CAMPAIGN-CONFIGMAP
      - name: pipeline
        configMap:
          name: PIPELINE-CONFIGMAP
      - name: data
        persistentVolumeClaim:
          claimName: DATA_PVC
      - name: work
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: s3
        secret:
          secretName: S3_SECRET
          defaultMode: 288
      initContainers:
      - name: warmup-wait
        image: IMAGE
        command:
        - /bin/sh
        - -c
        - WARMUP_WAIT_COMMAND
        # The default (`File`) reads /dev/termination-log, which a shell
        # script never writes -- the pod would fail with an EMPTY termination
        # message and the campaign card would show no reason at all. This
        # puts the container's own last lines there instead, and only when it
        # exits non-zero: the one sentence the gate prints before exit 13.
        terminationMessagePolicy: FallbackToLogsOnError
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 64Mi
