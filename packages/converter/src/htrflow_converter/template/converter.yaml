# PoC-shaped defaults for the htrflow-batch chart installed as release "htr"
# in namespace "htr-batch" (see htrflow-batch's docs/development/local-k3s.md).
# Every key here is optional in the converter — see
# docs/reference/campaign-yaml.md in htrflow-batch for the full list and
# defaults.
namespace: htr-batch
# These three name objects charts/htrflow-batch creates, and must agree with
# it by convention: `queue` <-> the chart's `queue.name`, `s3_secret` <->
# `s3.existingSecret`, `data_pvc` <-> `modelCache.name`. The two charts and
# this file agree by convention only — neither can see the other — and
# packages/converter/tests/test_chart_agreement.py fails when a rename
# lands on one side only. `runtime_class` has no chart counterpart.
queue: htr-batch

# Job parallelism, AND the cap every campaign's own `window:` is clamped to.
# Set it to what the ClusterQueue's nvidia.com/gpu quota can actually admit:
# rendering more and letting Kueue's partial admission shrink it makes the
# rendered file un-appliable afterwards (docs: reference/campaign-yaml.md).
window: 20
# The WorkloadPriorityClass names the chart ships (`queue.priorityClasses`),
# the only values a campaign's `priority:` may take. Kueue does not refuse
# an unknown name: the campaign would just read "Queued" for ever, so
# `validate` refuses it here instead. Leaving `priority:` out is htr-bulk.
priority_classes: [htr-interactive, htr-bulk, htr-idle]
s3_secret: htr-batch-s3
data_pvc: htr-test-data
runtime_class: nvidia

# Must be a browser-reachable URL base that serves the results bucket
# (htrflow-batch's `publicResultsBase` chart value, same value). Swap for a
# real one before applying anywhere but the PoC.
public_results_base: "http://localhost:30900/htr-results"

# How a campaign's bare reference code (`- R0001203`) becomes a IIIF
# manifest URL: {ref} is the code. Unset, only `manifest:` and `images:`
# volumes are allowed.
# source_template: "https://iiif.example.org/{ref}/manifest"

# Which registries a pipeline may pin, and whether every model needs a
# 40-hex revision, are NOT settings of this file: they are Kyverno
# ClusterPolicies the htrflow-batch chart ships
# (security.allowedImageRepos, security.requireModelRevision), enforced on
# everything the namespace admits — and re-run against rendered/ by the
# Kyverno CLI in this repo's CI, so a pull request still fails early.

# Named pod sizes a pipeline's `size:` picks; a pipeline without one runs
# at `default_size`, or with none set asks for 4 CPU, 8Gi (16Gi limit), 1
# GPU and a 2Gi /work on the first flavor with room. A size's `flavor` names
# an entry of `flavors`, which repeats the chart's `queue.flavors` names and
# nodeLabels (apply checks it against the cluster): Kueue picks a flavor by
# the pod's node selector, so the flavor's labels are what the converter
# renders, and every two flavors must share a label key with different
# values (docs: reference/campaign-yaml.md, Pod sizes).
# flavors:
#   - name: small-gpu
#     nodeLabels: { nvidia.com/gpu.product: <product label of the card> }
#   - name: large-gpu
#     nodeLabels: { nvidia.com/gpu.product: <product label of the card> }
# sizes:
#   small: { flavor: small-gpu, gpu: 1, cpu: 4, memory: 16Gi }
#   large: { flavor: large-gpu, gpu: 1, cpu: 8, memory: 32Gi, workdir: 4Gi }
# default_size: small
