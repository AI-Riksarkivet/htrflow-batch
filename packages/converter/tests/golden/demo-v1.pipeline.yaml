apiVersion: v1
kind: ConfigMap
metadata:
  name: htr-pipeline-demo-v1
  namespace: htr-test
  labels:
    htrflow.riksarkivet.se/managed-by: converter
    htrflow.riksarkivet.se/pipeline: demo-v1
  annotations:
    htrflow.riksarkivet.se/pipeline-sha256: 2242f17e78f00a521f028a3d9230a5b9a36231d837d86e0036a6701676b49a36
data:
  pipeline.yaml: "steps:\n- step: Segmentation\n  settings:\n    model: yolo\n   \
    \ model_settings:\n      model: Riksarkivet/yolov9-regions-1\n- step: TextRecognition\n\
    \  settings:\n    model: TrOCR\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: htr-warmup-demo-v1
  namespace: htr-test
  labels:
    app: htrflow-warmup
    htrflow.riksarkivet.se/managed-by: converter
    htrflow.riksarkivet.se/pipeline: demo-v1
spec:
  backoffLimit: 2
  podFailurePolicy:
    rules:
    - action: Ignore
      onPodConditions:
      - type: DisruptionTarget
    - action: FailJob
      onExitCodes:
        containerName: warmup
        operator: In
        values:
        - 13
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        app: htrflow-warmup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: warmup
        image: ghcr.io/riksarkivet/htrflow-batch@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        command:
        - /bin/sh
        - -c
        args:
        - 'set -eu

          mkdir -p "$HOME" "$TMPDIR" "$YOLO_CONFIG_DIR" "$HF_HOME"

          exec python -m htrflow_batch.warmup

          '
        env:
        - name: PIPELINE_PATH
          value: /config/pipeline.yaml
        - name: PIPELINE_ID
          value: demo-v1
        - name: CUDA_VISIBLE_DEVICES
          value: ''
        - name: HF_HOME
          value: /data/hf
        - name: WORKDIR_PATH
          value: /work
        - name: HOME
          value: /work/home
        - name: TMPDIR
          value: /work/tmp
        - name: YOLO_CONFIG_DIR
          value: /work/ultralytics
        volumeMounts:
        - name: pipeline
          mountPath: /config
        - name: data
          mountPath: /data
        - name: work
          mountPath: /work
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: '2'
            memory: 4Gi
          limits:
            cpu: '2'
            memory: 8Gi
      volumes:
      - name: pipeline
        configMap:
          name: htr-pipeline-demo-v1
      - name: data
        persistentVolumeClaim:
          claimName: htr-test-data
      - name: work
        emptyDir:
          sizeLimit: 4Gi
