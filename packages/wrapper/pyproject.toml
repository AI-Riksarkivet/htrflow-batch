[project]
name = "htrflow-batch-wrapper"
version = "0.5.0"
license = "EUPL-1.2"
description = "Runs htrflow over IIIF volumes in Kubernetes and publishes ALTO and PAGE XML to S3"
authors = [{ name = "Riksarkivet AI-labbet" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    # bounded.Deadline reads the connections a request opens through
    # httpcore's `trace` extension (3063); httpx 0.27+ pins httpcore 1.x.
    "httpcore>=1.0",
    "boto3>=1.34",
    "pyyaml",
    "pydantic>=2.13.5",
    "huggingface-hub>=1.31.0,<2",
    # fetch.py opens each downloaded image's header to bound its pixel count
    # (W14). The runtime image installs its own pin last (the `wrapper-image`
    # group), which is the one that survives there.
    "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "htrflow: needs the htrflow runtime; runs inside the wrapper image (make test-driver-real / dagger call test-driver)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
