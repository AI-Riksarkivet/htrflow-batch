[project]
name = "htrflow-batch-wrapper"
version = "0.2.0"
description = "D16 streaming wrapper: IIIF -> htrflow -> S3 (docs: how-it-works/wrapper)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "boto3>=1.34",
    "pyyaml",
    "pydantic>=2.7",
    "huggingface-hub>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htrflow_batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "htrflow: needs the htrflow runtime; runs inside the wrapper image (make test-driver-real / dagger call test-driver)",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
