[project]
site_name = "htrflow-batch"
site_description = "Kueue-gated batch HTR around the htrflow image — streaming per-page results to S3 with IIIF viewer output."
site_author = "Riksarkivet"
site_url = "https://ai-riksarkivet.github.io/htrflow-batch/"
copyright = """
Copyright &copy; 2026 Riksarkivet
"""
repo_url = "https://github.com/AI-Riksarkivet/htrflow-batch"
repo_name = "AI-Riksarkivet/htrflow-batch"
edit_uri = "edit/main/docs/"

nav = [
  { "htrflow-batch" = ["index.md"] },
  { "Getting Started" = [
    {"Prerequisites" = "getting-started/index.md"},
    {"Deploy" = "getting-started/deploy.md"},
    {"Run a Volume" = "getting-started/run-a-volume.md"},
    {"Running a Campaign" = "getting-started/campaigns.md"},
    {"Viewing Results" = "getting-started/viewing.md"},
  ]},
  { "How it Works" = [
    {"Architecture" = "how-it-works/architecture.md"},
    {"Decision Log" = "how-it-works/decision-log.md"},
    {"The Wrapper" = "how-it-works/wrapper.md"},
    {"Queueing (Kueue)" = "how-it-works/queueing.md"},
    {"Events and Signals" = "how-it-works/signals.md"},
    {"Campaigns (Indexed Jobs)" = "how-it-works/campaigns.md"},
    {"Memory Budget" = "how-it-works/memory-budget.md"},
    {"Failure Handling" = "how-it-works/failure-handling.md"},
    {"Live Run Log" = "how-it-works/live-run-log.md"},
  ]},
  { "Reference" = [
    {"Overview" = "reference/index.md"},
    {"Configuration" = "reference/configuration.md"},
    {"Campaign & Pipeline YAML" = "reference/campaign-yaml.md"},
    {"Wrapper" = "reference/wrapper.md"},
    {"Chart Values" = "reference/chart.md"},
    {"S3 Layout" = "reference/s3-layout.md"},
    {"Campaign Browser" = "reference/frontend.md"},
  ]},
  { "Roadmap" = [
    {"Phase 2: Cache Layer" = "roadmap/phase-2-cache.md"},
    {"Evolution" = "roadmap/evolution.md"},
    {"Open Items" = "roadmap/open-items.md"},
  ]},
  { "Development" = [
    {"Setup" = "development/index.md"},
    {"Testing" = "development/testing.md"},
    {"CI" = "development/ci.md"},
    {"Security" = "development/security.md"},
    {"Deployment" = "development/deployment.md"},
    {"Local k3s" = "development/local-k3s.md"},
    {"Indexed Jobs E2E" = "development/e2e-indexed-jobs.md"},
    {"Test Log" = "development/test-log.md"},
    {"Audit 2026-08-26" = "audits/2026-08-26-repo-audit.md"},
    {"Hard-coded config inventory" = "audits/2026-08-26-hardcoded-inventory.md"},
    {"Docs audit 2026-09-04" = "audits/2026-09-04-docs-audit.md"},
  ]},
]

[project.theme]
language = "en"
favicon = "assets/favicon.ico"
logo = "assets/ra.svg"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AI-Riksarkivet/htrflow-batch"

# Declaring ANY markdown_extensions replaces zensical's default set wholesale,
# so every extension the docs rely on has to be named here. `!!! note` blocks
# need `admonition` (no `???` collapsibles are used, so pymdownx.details is not
# required).
[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
