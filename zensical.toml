[project]
site_name = "htrflow-batch"
site_description = "Kueue-gated batch HTR around the htrflow image — streaming per-page results to S3 with IIIF viewer output."
site_author = "Riksarkivet"
site_url = "https://ai-riksarkivet.github.io/htrflow-batch/"
copyright = """
Copyright &copy; 2026 Riksarkivet
"""
repo_url = "https://github.com/AI-Riksarkivet/htrflow-batch"
repo_name = "AI-Riksarkivet/htrflow-batch"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/diagrams.css"]

nav = [
  { "htrflow-batch" = ["index.md"] },
  { "Getting Started" = [
    {"Prerequisites" = "getting-started/index.md"},
    {"Deploy" = "getting-started/deploy.md"},
    {"Try it" = "getting-started/try-it.md"},
    {"Run a Campaign" = "getting-started/campaigns.md"},
    {"View Results" = "getting-started/viewing.md"},
  ]},
  { "How it Works" = [
    {"Architecture" = "how-it-works/architecture.md"},
    {"Campaigns" = "how-it-works/campaigns.md"},
    {"Queueing" = "how-it-works/queueing.md"},
    {"The Wrapper" = "how-it-works/wrapper.md"},
    {"From Image to Transcription" = "how-it-works/page-flow.md"},
    {"Failure Handling" = "how-it-works/failure-handling.md"},
    {"Events and Signals" = "how-it-works/signals.md"},
    {"Security" = "how-it-works/security.md"},
  ]},
  { "Reference" = [
    {"Overview" = "reference/index.md"},
    {"Configuration" = "reference/configuration.md"},
    {"Campaign & Pipeline YAML" = "reference/campaign-yaml.md"},
    {"htrflow-campaigns CLI" = "reference/cli.md"},
    {"Rendered Objects" = "reference/rendered.md"},
    {"Wrapper" = "reference/wrapper.md"},
    {"Chart Values" = "reference/chart.md"},
    {"S3 Layout" = "reference/s3-layout.md"},
    {"Web Front & Read API" = "reference/web.md"},
  ]},
  { "Presentations" = ["presentations.md"] },
  { "Roadmap" = [
    {"Open and Next" = "roadmap/index.md"},
    {"Cache Layer" = "roadmap/cache-layer.md"},
  ]},
  { "Development" = [
    {"Setup" = "development/index.md"},
    {"Testing" = "development/testing.md"},
    {"CI" = "development/ci.md"},
    {"Releasing" = "development/releasing.md"},
    {"Dev Cluster" = "development/dev-cluster.md"},
    {"Third-party Licences" = "development/licenses.md"},
  ]},
]

[project.theme]
language = "en"
favicon = "assets/favicon.ico"
logo = "assets/ra.svg"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/AI-Riksarkivet/htrflow-batch"

# Declaring ANY markdown_extensions replaces zensical's default set wholesale,
# so every extension the docs rely on has to be named here. `!!! note` blocks
# need `admonition` (no `???` collapsibles are used, so pymdownx.details is not
# required).
[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
