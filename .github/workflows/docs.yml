name: Documentation
# The repo is public and Pages is enabled (2026-09-07), so every merge to
# main publishes the site; the dispatch stays for a manual rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false # the Pages deploy uses its own token, never git
      # zensical comes from uv.lock's `docs` group: pinned and hash-checked,
      # the same version on every run (OpenSSF Scorecard Pinned-Dependencies).
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked --only-group docs
      # Absolute: docs-site.sh cds into its staging directory before running
      # $ZENSICAL, where a relative .venv/bin/zensical does not exist.
      - run: ZENSICAL="$PWD/.venv/bin/zensical" scripts/docs-site.sh build --clean --strict
      # The slide decks, after the site build (which clears site/): HTML and
      # PDF into site/slides, linked from the Presentations page. Diagrams
      # are the committed SVGs (MERMAID=skip); Marp's PDF export drives the
      # runner's own Chrome. slides.sh pins the Marp version it runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: |
          chrome="$(command -v google-chrome)"
          CHROME_PATH="$chrome" MERMAID=skip SLIDES_FORMATS="html pdf" scripts/slides.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
