name: Scorecard supply-chain security

# OpenSSF Scorecard grades this repository's supply-chain posture out of 10 —
# pinned dependencies, signed releases, branch protection, token permissions
# and so on. `publish_results: true` is what makes the score public and what
# the README badge reads. The scorecard action refuses to publish from a
# workflow with anything but a small allow-list of steps, so keep this file
# to checkout, the analysis and the two uploads.
on:
  # The Branch-Protection check only ever looks at the default branch.
  branch_protection_rule:
  # Keeps the Maintained check fresh even in a quiet week.
  schedule:
    - cron: "30 1 * * 6" # Saturdays, 01:30 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write # upload the SARIF to the Security tab
      id-token: write # publish the result, which is what the badge reads
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Branch-Protection is the one check that needs a PAT with repo
          # scope even on a public repository, so it scores 0 until one is
          # configured. Nothing else here depends on it:
          #   repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload the SARIF as an artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
