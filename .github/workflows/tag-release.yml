name: Tag the release

# The last step of a release (docs/development/releasing.md). publish.yml's
# pin job merges the pin PR with GITHUB_TOKEN, which starts no workflow, so it
# dispatches "Published images" on main afterwards. When that run passes, the
# commit it checked is the pin commit: this workflow tags it v<version> and
# dispatches release.yml on the tag, which writes the signed GitHub release.
# (A tag pushed with GITHUB_TOKEN starts no workflow either, hence the
# dispatch.) The weekly scheduled run of "Published images" never tags.
#
# A re-run is safe: a tag already on this commit is kept and release.yml is
# dispatched again; a tag on any other commit stops the run.
on:
  workflow_run:
    workflows: ["Published images"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  tag:
    name: Tag the pin commit
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the tag
      actions: write # dispatch release.yml on it
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The commit whose images were checked, not whatever main is by now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0 # `state` reads the tags; main is needed for the ancestry check
          persist-credentials: false # the push below gets the token for itself

      - name: Tag and start the release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME="$GIT_COMMITTER_NAME" GIT_AUTHOR_EMAIL="$GIT_COMMITTER_EMAIL"
          version="$(python3 scripts/release.py version)"
          TAG="v${version}"
          existing="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "$HEAD_SHA" ]]; then
              echo "::error::${TAG} already names ${existing}, not ${HEAD_SHA}; tags are never moved"
              exit 1
            fi
            echo "${TAG} is already on ${HEAD_SHA}; starting its release again"
          else
            state="$(python3 scripts/release.py state)"
            if [[ "$state" != "tag" ]]; then
              echo "state at ${HEAD_SHA} is ${state}: nothing to tag"
              exit 0
            fi
            if ! git merge-base --is-ancestor "$HEAD_SHA" origin/main; then
              echo "::error::${HEAD_SHA} is not on main"
              exit 1
            fi
            git tag -a "$TAG" -m "$TAG" "$HEAD_SHA"
            # The token goes to this one push as a header, the way checkout
            # would have stored it, and no hook runs with it.
            auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            echo "::add-mask::$auth"
            git -c core.hooksPath=/dev/null \
              -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
              push origin "refs/tags/${TAG}"
          fi
          gh workflow run release.yml --ref "$TAG"
