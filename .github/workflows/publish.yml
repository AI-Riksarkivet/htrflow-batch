name: Publish
# Manual, one tag per run, every component (audit T6/X16). The dagger
# publish-docker function tests before it builds, publishes, and returns the
# reference with its digest; that digest is then signed with cosign (keyless,
# Sigstore OIDC) and given SLSA build-provenance and SBOM attestations, so a
# cluster policy (chart: security.verifyImages) can verify what it pulls.
#
# Tags are immutable: the run refuses a tag that already exists on the
# registry. Bump packages/wrapper/pyproject.toml and use a new tag instead of
# re-pushing (the wrapper's version must equal the tag — see resolveTag).
#
# EVERY image ships for two architectures and is built NATIVELY for each: on
# ubuntu-24.04 for amd64, on ubuntu-24.04-arm for arm64 (free for public
# repositories). Never one runner with qemu — uv segfaults under qemu-x86_64,
# and a cross-built GPU image cannot be smoke-tested anywhere. Each job
# pushes its own `<tag>-<arch>` and signs/attests it; a final job joins each
# image's pair into the manifest list `<tag>` that the chart and campaign
# pipelines actually reference, and signs that too. The web image was
# amd64-only until then, which is an ImagePullBackOff on an arm64 node.
#
# The wrapper builds its htrflow base itself, from htrflow at the commit the
# dockerfile pins and the lock committed in .docker/htrflow-base/, on both
# architectures, so every image goes through the same dagger function and
# its gates. (Until then the arm64 wrapper needed a separately built base
# the dagger engine could not see, and a job of its own; the amd64 one ran
# on the upstream htrflow image, which failed the driver test.)
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (vX.Y.Z, = packages/wrapper/pyproject.toml version). Never reuse a published tag."
        required: true
        type: string
      transformers_version:
        description: "TRANSFORMERS_VERSION build arg for the wrapper (empty keeps the dockerfile default, the line upstream htrflow is tested on). Set it to publish the tag on the other transformers line, for models the default line cannot read; a pipeline pins the image digest it runs, so both lines can be in use at once."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Every job below holds the Docker Hub credential and the signing identity,
# so every job runs in the `release` environment (finding 3068). What makes
# that a protection lives in the repository settings, not here: required
# reviewers, deployments from `main` only, and DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN as secrets of that environment instead of the repository
# or the organisation (docs/development/releasing.md). Until those are set,
# GitHub creates the environment on the first run with no rules, and the
# repository secrets stay visible to it, so the workflow runs as before.
jobs:
  # Every image for both architectures, one matrix entry per image and
  # architecture on a runner of that architecture: same job body, same
  # `<tag>-<arch>` scheme, same gates in publish-docker (tag check, tests,
  # the driver test for the wrapper, Trivy), same sign-and-attest step.
  # Never one runner with qemu: cross-building is what
  # test_publish_workflow.py and test_dockerfile_workspace.py forbid.
  publish:
    name: Publish ${{ matrix.component }}${{ matrix.tag_suffix }}
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
      id-token: write # cosign keyless signing + provenance
      attestations: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: wrapper
            repository: riksarkivet/htrflow-batch
            tag_suffix: "-amd64"
            runner: ubuntu-24.04
          - component: wrapper
            repository: riksarkivet/htrflow-batch
            tag_suffix: "-arm64"
            runner: ubuntu-24.04-arm
          - component: web
            repository: riksarkivet/htrflow-web
            tag_suffix: "-amd64"
            runner: ubuntu-24.04
          - component: web
            repository: riksarkivet/htrflow-web
            tag_suffix: "-arm64"
            runner: ubuntu-24.04-arm
          - component: campaigns
            repository: riksarkivet/htrflow-campaigns
            tag_suffix: "-amd64"
            runner: ubuntu-24.04
          - component: campaigns
            repository: riksarkivet/htrflow-campaigns
            tag_suffix: "-arm64"
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: docker.io
      IMAGE: docker.io/${{ matrix.repository }}
      # The dispatch inputs reach every `run:` below as environment
      # variables and never as `${{ }}` inside the script: an expression is
      # substituted into the text before a shell exists, so whatever was
      # typed into the dispatch form would be code in a job holding the
      # registry credential and the signing identity. The tag pattern is
      # checked in the first step, which is itself one of those scripts, so
      # it can never be what protects them.
      TAG: ${{ inputs.tag }}
      TAG_SUFFIX: ${{ matrix.tag_suffix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; the token would outlive the step

      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag must look like vX.Y.Z"; exit 1; }

      # Tools before credentials (finding 3070): nothing is downloaded after
      # the login that is not pinned by checksum or digest.
      - uses: ./.github/actions/setup-dagger

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        # Both the per-arch tag this job pushes and the plain tag the manifest
        # job will create must be free — the manifest list is as immutable as
        # the images under it.
        run: |
          for ref in "${IMAGE}:${TAG}${TAG_SUFFIX}" "${IMAGE}:${TAG}"; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref already exists; tags are immutable — bump the version and publish a new tag"
              exit 1
            fi
          done

      # Every value reaches the command through this step's environment,
      # never as `${{ }}` in the script, so the shell treats it as data.
      # dagger prints the function's return value -- the pushed reference
      # with its digest -- on stdout and its progress on stderr.
      - name: Publish with Dagger (tests, builds, pushes)
        id: digest
        run: |
          ref="$(dagger call --progress plain publish-docker \
            --component "$COMPONENT" \
            --tag "$TAG" \
            --tag-suffix "$TAG_SUFFIX" \
            --transformers-version "$TRANSFORMERS_VERSION" \
            --docker-username env:DOCKERHUB_USERNAME \
            --docker-password env:DOCKERHUB_TOKEN)"
          ref="$(printf '%s' "$ref" | tr -d '[:space:]')"
          digest="${ref##*@}"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in dagger output: $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}@${digest}"
        env:
          COMPONENT: ${{ matrix.component }}
          TRANSFORMERS_VERSION: ${{ inputs.transformers_version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - uses: ./.github/actions/sign-attest
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.digest.outputs.digest }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The digest this job pushed and signed, for the manifest job (audit
      # 0923 D-10). A matrix job has one set of outputs, the last entry's,
      # so each entry hands its digest over as an artifact of its own.
      - name: Record the signed digest
        run: printf '%s\n' "$DIGEST" > "digest-${COMPONENT}${TAG_SUFFIX}"
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          COMPONENT: ${{ matrix.component }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.component }}${{ matrix.tag_suffix }}
          path: digest-${{ matrix.component }}${{ matrix.tag_suffix }}
          if-no-files-found: error
          # A release approved days after the builds must still find them.
          retention-days: 7

  # The tags everything else references: one manifest list per image over its
  # two per-arch images, so `docker pull riksarkivet/htrflow-batch:<tag>` (or
  # htrflow-web) and a chart digest resolve to the right architecture by
  # themselves. Signed and provenance-attested like its members; no SBOM of
  # its own — the per-arch images carry the package lists, and an SBOM of an
  # index would only be an SBOM of whichever arch the runner happens to be.
  # Both entries wait for every publish entry: `needs` is per job, not per
  # matrix entry, and one job here is cheaper than a second copy of it.
  manifest:
    name: Manifest list (${{ matrix.component }})
    needs: [publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: wrapper
            repository: riksarkivet/htrflow-batch
          - component: web
            repository: riksarkivet/htrflow-web
          - component: campaigns
            repository: riksarkivet/htrflow-campaigns
    env:
      REGISTRY: docker.io
      IMAGE: docker.io/${{ matrix.repository }}
      TAG: ${{ inputs.tag }}   # as data, not as script text — see the publish job
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The two digests the publish entries signed (audit 0923 D-10).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.component }}-*
          merge-multiple: true
          path: digests

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The list is built from the digests the publish entries signed, never
      # from the per-arch tags: a tag re-pushed between the two jobs would
      # make the signed list name an unsigned member (audit 0923 D-10). The
      # tags are still read, to refuse that case loudly -- after it the tag
      # and the release would disagree about what the release is.
      - name: Create the manifest list
        id: create
        run: |
          amd64="$(cat "digests/digest-${COMPONENT}-amd64")"
          arm64="$(cat "digests/digest-${COMPONENT}-arm64")"
          signed() {
            [[ "$2" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no signed digest for $1: $2"; exit 1; }
            got="$(docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}')"
            [[ "$got" == "$2" ]] || { echo "::error::$1 is $got, but the publish job signed $2"; exit 1; }
          }
          signed "${IMAGE}:${TAG}-amd64" "$amd64"
          signed "${IMAGE}:${TAG}-arm64" "$arm64"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}@${amd64}" "${IMAGE}@${arm64}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for the manifest list: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

      - uses: ./.github/actions/sign-attest
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.create.outputs.digest }}
          sbom: "false"
