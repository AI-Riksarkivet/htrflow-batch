name: Publish
# Manual, one tag per run, every component (audit T6/X16). The dagger
# publish-docker function tests before it builds, publishes, and returns the
# reference with its digest; that digest is then signed with cosign (keyless,
# Sigstore OIDC) and given SLSA build-provenance and SBOM attestations, so a
# cluster policy (chart: security.verifyImages) can verify what it pulls.
#
# Tags are immutable: the run refuses a tag that already exists on the
# registry. Bump packages/wrapper/pyproject.toml and use a new tag instead of
# re-pushing (the wrapper's version must equal the tag — see resolveTag).
#
# The native arm64 GPU wrapper (.docker/htrflow-batch-gpu-arm64.dockerfile)
# is NOT built here: it needs the locally built htrflow:v0.2.6-arm64 base,
# which lives on the GB10 node only. Publish it by hand with
# `make poc-push-arm64` (docs: development/deployment), which stamps the same
# HTRFLOW_BASE_REVISION label from the local htrflow checkout.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (vX.Y.Z, = packages/wrapper/pyproject.toml version). Never reuse a published tag."
        required: true
        type: string
      base_revision:
        description: "HTRFLOW_BASE_REVISION build arg for the wrapper: `git describe --tags --always --dirty` of the htrflow checkout the base image was built from (empty keeps the dockerfile default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.component }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing + provenance
      attestations: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: wrapper
            repository: riksarkivet/htrflow-batch
          - component: web
            repository: riksarkivet/htrflow-web
    env:
      REGISTRY: docker.io
      IMAGE: docker.io/${{ matrix.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate the tag
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag must look like vX.Y.Z"; exit 1; }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        run: |
          ref="${IMAGE}:${{ inputs.tag }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "::error::$ref already exists; tags are immutable — bump the version and publish a new tag"
            exit 1
          fi

      - name: Publish with Dagger (tests, builds, pushes)
        id: publish
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: >-
            publish-docker
            --component ${{ matrix.component }}
            --tag ${{ inputs.tag }}
            --base-revision "${{ inputs.base_revision }}"
            --docker-username env:DOCKERHUB_USERNAME
            --docker-password env:DOCKERHUB_TOKEN
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract the published digest
        id: digest
        run: |
          ref="$(printf '%s' "$PUBLISHED" | tr -d '[:space:]')"
          digest="${ref##*@}"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in dagger output: $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}@${digest}"
        env:
          PUBLISHED: ${{ steps.publish.outputs.output }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest (keyless, Sigstore)
        run: cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.digest }}"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: SBOM (Trivy, SPDX)
        # Trivy runs in its own container: pass registry credentials so a
        # private (or freshly auto-created) Docker Hub repository still scans.
        run: |
          docker run --rm -v "$PWD:/out" \
            -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --skip-version-check --format spdx-json --output /out/sbom.spdx.json \
            "${IMAGE}@${{ steps.digest.outputs.digest }}"
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
