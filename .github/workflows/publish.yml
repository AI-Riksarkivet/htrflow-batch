name: Publish
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish image with SBOM & Provenance
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      image: docker.io/riksarkivet/htrflow-batch
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Tests
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Build and push with attestations
        id: build
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "publish-docker --component wrapper --docker-username env:DOCKERHUB_USERNAME --docker-password env:DOCKERHUB_TOKEN"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign container images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "Signing riksarkivet/htrflow-batch@${DIGEST}"
          cosign sign --yes riksarkivet/htrflow-batch@${DIGEST}

  # SLSA Build L3 provenance: generated in the SLSA project's isolated trusted
  # builder (own OIDC identity — the publish job above cannot forge it), signed
  # keylessly via Sigstore, and attached to the image in the registry. Verify:
  #   slsa-verifier verify-image docker.io/riksarkivet/htrflow-batch@<digest> \
  #     --source-uri github.com/carpelan/htrflow-batch
  # The generator must be referenced by release tag (not SHA): slsa-verifier
  # validates the builder identity against the tagged workflow ref.
  provenance:
    name: Generate SLSA L3 provenance
    needs: [publish]
    permissions:
      actions: read # read the workflow run when generating provenance
      id-token: write # keyless signing of the attestation
      packages: write # attach the attestation to the registry image
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      # Private repo: acknowledge that the signed provenance (and with it the
      # repo name) lands in the public Rekor log — already the case via the
      # cosign sign step's Rekor entry.
      private-repository: true
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-password: ${{ secrets.DOCKERHUB_SECRET }}
