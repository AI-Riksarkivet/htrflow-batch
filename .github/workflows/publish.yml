name: Publish
on:
  workflow_dispatch:

permissions:
  contents: read

# Attestation/signing (cosign + SLSA) was removed when the build moved to dagger
# publish — reintroduce by capturing the digest from the dagger call output if needed.

jobs:
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Publish with Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: "publish-docker --component wrapper --docker-username env:DOCKERHUB_USERNAME --docker-password env:DOCKERHUB_TOKEN"
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "latest"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
