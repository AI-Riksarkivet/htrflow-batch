name: Publish
# Manual, one tag per run, every component (audit T6/X16). The dagger
# publish-docker function tests before it builds, publishes, and returns the
# reference with its digest; that digest is then signed with cosign (keyless,
# Sigstore OIDC) and given SLSA build-provenance and SBOM attestations, so a
# cluster policy (chart: security.verifyImages) can verify what it pulls.
#
# Tags are immutable: the run refuses a tag that already exists on the
# registry. Bump packages/wrapper/pyproject.toml and use a new tag instead of
# re-pushing (the wrapper's version must equal the tag — see resolveTag).
#
# BOTH images ship for two architectures and are built NATIVELY for each: on
# ubuntu-24.04 for amd64, on ubuntu-24.04-arm for arm64 (free for public
# repositories). Never one runner with qemu — uv segfaults under qemu-x86_64,
# and a cross-built GPU image cannot be smoke-tested anywhere. Each job
# pushes its own `<tag>-<arch>` and signs/attests it; a final job joins each
# image's pair into the manifest list `<tag>` that the chart and campaign
# pipelines actually reference, and signs that too. The web image was
# amd64-only until then, which is an ImagePullBackOff on an arm64 node.
#
# The arm64 job also builds the wrapper's BASE image, because there is no
# published arm64 htrflow: it clones AI-Riksarkivet/htrflow at the pinned
# HTRFLOW_ARM64_BASE_REF below, locks it (the lockfile is gitignored there)
# and builds docker/htrflow.dockerfile — the same two commands
# `make build-htrflow-base-arm64` runs on the GB10 node, in a throwaway
# checkout. Renovate tracks that ref.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (vX.Y.Z, = packages/wrapper/pyproject.toml version). Never reuse a published tag."
        required: true
        type: string
      base_revision:
        description: "HTRFLOW_BASE_REVISION build arg for the amd64 wrapper: `git describe --tags --always --dirty` of the htrflow checkout the base image was built from (empty keeps the dockerfile default). The arm64 job derives its own from the pinned clone."
        required: false
        default: ""
        type: string
      transformers_version:
        description: "TRANSFORMERS_VERSION build arg for the wrapper (empty keeps the dockerfile default, the line upstream htrflow is tested on). Set it to publish the tag on the other transformers line, for models the default line cannot read; a pipeline pins the image digest it runs, so both lines can be in use at once."
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # AI-Riksarkivet/htrflow commit the arm64 base is built from: 0ede4da is
  # main's tip on 2026-09-02; the last commit that touches anything the base
  # image copies (src/, uv.lock, pyproject.toml) is ef0ed37, two docs-only
  # commits earlier, so 0ede4da's tree of the image's inputs is identical to
  # the base the GB10 node has been running since 2026-08-25.
  HTRFLOW_ARM64_BASE_REF: 0ede4da5493cf01ac97024558a5e4f468d5f360f
  HTRFLOW_ARM64_BASE: htrflow:v0.2.6-arm64

jobs:
  # Everything dagger can build by itself: the amd64 wrapper, and the web
  # image for both architectures. The web image is a plain Node/Python build
  # with no base of its own to prepare, so one matrix entry per architecture
  # on a runner of that architecture is the whole change — same job body,
  # same `<tag>-<arch>` scheme, same sign-and-attest step as the wrapper.
  # Never one runner with qemu: cross-building is what
  # test_publish_workflow.py and test_dockerfile_workspace.py forbid.
  publish:
    name: Publish ${{ matrix.component }}${{ matrix.tag_suffix }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # cosign keyless signing + provenance
      attestations: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: wrapper
            repository: riksarkivet/htrflow-batch
            tag_suffix: "-amd64"
            runner: ubuntu-24.04
          - component: web
            repository: riksarkivet/htrflow-web
            tag_suffix: "-amd64"
            runner: ubuntu-24.04
          - component: web
            repository: riksarkivet/htrflow-web
            tag_suffix: "-arm64"
            runner: ubuntu-24.04-arm
    env:
      REGISTRY: docker.io
      IMAGE: docker.io/${{ matrix.repository }}
      # The dispatch inputs reach every `run:` below as environment
      # variables and never as `${{ }}` inside the script: an expression is
      # substituted into the text before a shell exists, so whatever was
      # typed into the dispatch form would be code in a job holding the
      # registry credential and the signing identity. The tag pattern is
      # checked in the first step, which is itself one of those scripts, so
      # it can never be what protects them.
      TAG: ${{ inputs.tag }}
      TAG_SUFFIX: ${{ matrix.tag_suffix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false # nothing here pushes; the token would outlive the step

      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag must look like vX.Y.Z"; exit 1; }

      # Tools before credentials (finding 3070): nothing is downloaded after
      # the login that is not pinned by checksum or digest.
      - uses: ./.github/actions/setup-dagger

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        # Both the per-arch tag this job pushes and the plain tag the manifest
        # job will create must be free — the manifest list is as immutable as
        # the images under it.
        run: |
          for ref in "${IMAGE}:${TAG}${TAG_SUFFIX}" "${IMAGE}:${TAG}"; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref already exists; tags are immutable — bump the version and publish a new tag"
              exit 1
            fi
          done

      # Every value reaches the command through this step's environment,
      # never as `${{ }}` in the script, so the shell treats it as data.
      # dagger prints the function's return value -- the pushed reference
      # with its digest -- on stdout and its progress on stderr.
      - name: Publish with Dagger (tests, builds, pushes)
        id: digest
        run: |
          ref="$(dagger call --progress plain publish-docker \
            --component "$COMPONENT" \
            --tag "$TAG" \
            --tag-suffix "$TAG_SUFFIX" \
            --base-revision "$BASE_REVISION" \
            --transformers-version "$TRANSFORMERS_VERSION" \
            --docker-username env:DOCKERHUB_USERNAME \
            --docker-password env:DOCKERHUB_TOKEN)"
          ref="$(printf '%s' "$ref" | tr -d '[:space:]')"
          digest="${ref##*@}"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest in dagger output: $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}@${digest}"
        env:
          COMPONENT: ${{ matrix.component }}
          BASE_REVISION: ${{ inputs.base_revision }}
          TRANSFORMERS_VERSION: ${{ inputs.transformers_version }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - uses: ./.github/actions/sign-attest
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.digest.outputs.digest }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  # arm64 wrapper: its own base first, then plain `docker build`. Not dagger —
  # the dagger engine builds in its own cache and cannot see an image tag that
  # only exists in this runner's docker daemon, and pushing the base to a
  # registry just to hand it back would publish an image nobody consumes.
  # The gate dagger gives the other job (tests before push) is `test` here.
  publish-wrapper-arm64:
    name: Publish wrapper-arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: read
    env:
      REGISTRY: docker.io
      IMAGE: docker.io/riksarkivet/htrflow-batch
      TAG: ${{ inputs.tag }}   # as data, not as script text — see the publish job
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate the tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::tag must look like vX.Y.Z"; exit 1; }

      - uses: ./.github/actions/setup-dagger # before the login, as above

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse to overwrite a published tag
        run: |
          for ref in "${IMAGE}:${TAG}-arm64" "${IMAGE}:${TAG}"; do
            if docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref already exists; tags are immutable — bump the version and publish a new tag"
              exit 1
            fi
          done

      - name: Tests (pytest) — the gate dagger gives the amd64 job
        run: dagger call --progress plain test
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Build the arm64 htrflow base
        id: base
        uses: ./.github/actions/build-htrflow-base-arm64
        with:
          ref: ${{ env.HTRFLOW_ARM64_BASE_REF }}
          image: ${{ env.HTRFLOW_ARM64_BASE }}

      - name: Build and push the arm64 wrapper
        env:
          # Only passed when the run asked for a line: an empty build arg
          # would override the dockerfile's default with nothing.
          TRANSFORMERS_VERSION: ${{ inputs.transformers_version }}
          # A step output is as much an outside value as a dispatch input.
          BASE_REVISION: ${{ steps.base.outputs.revision }}
        run: |
          ref="${IMAGE}:${TAG}-arm64"
          transformers=()
          if [ -n "$TRANSFORMERS_VERSION" ]; then
            transformers=(--build-arg "TRANSFORMERS_VERSION=${TRANSFORMERS_VERSION}")
          fi
          docker build -f .docker/htrflow-batch.dockerfile \
            --build-arg "HTRFLOW_ARM64_BASE=${HTRFLOW_ARM64_BASE}" \
            --build-arg "HTRFLOW_BASE_REVISION=${BASE_REVISION}" \
            --build-arg "HTRFLOW_BATCH_VERSION=${TAG}" \
            "${transformers[@]}" \
            -t "$ref" .
          docker push "$ref"

      - name: Extract the published digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}-arm64" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for the pushed image: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published ${IMAGE}@${digest}"

      - uses: ./.github/actions/sign-attest
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.digest.outputs.digest }}
          registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry-password: ${{ secrets.DOCKERHUB_TOKEN }}

  # The tags everything else references: one manifest list per image over its
  # two per-arch images, so `docker pull riksarkivet/htrflow-batch:<tag>` (or
  # htrflow-web) and a chart digest resolve to the right architecture by
  # themselves. Signed and provenance-attested like its members; no SBOM of
  # its own — the per-arch images carry the package lists, and an SBOM of an
  # index would only be an SBOM of whichever arch the runner happens to be.
  # Both entries wait for both publish jobs: `needs` is per job, not per
  # matrix entry, and one job here is cheaper than a second copy of it.
  manifest:
    name: Manifest list (${{ matrix.component }})
    needs: [publish, publish-wrapper-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: wrapper
            repository: riksarkivet/htrflow-batch
          - component: web
            repository: riksarkivet/htrflow-web
    env:
      REGISTRY: docker.io
      IMAGE: docker.io/${{ matrix.repository }}
      TAG: ${{ inputs.tag }}   # as data, not as script text — see the publish job
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the manifest list
        id: create
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]] || { echo "::error::no digest for the manifest list: $digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "${IMAGE}@${digest}"

      - uses: ./.github/actions/sign-attest
        with:
          image: ${{ env.IMAGE }}
          digest: ${{ steps.create.outputs.digest }}
          sbom: "false"
