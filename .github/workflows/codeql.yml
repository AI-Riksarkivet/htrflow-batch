name: CodeQL

# Static analysis, which is what Scorecard's SAST check looks for. Free for
# public repositories. One matrix entry per language this repository actually
# ships: the Python packages (wrapper, converter, web), the campaign browser
# (TypeScript/Svelte), the dagger module (Go) and the workflows themselves
# (actions) — leaving any one out would leave that part unexamined.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 3 * * 1" # Mondays, so a new rule pack is noticed without a push
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write # write the findings to the Security tab
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyse
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"
