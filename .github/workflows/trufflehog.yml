name: Secret Leaks

# GitHub's own secret scanning is enabled on this public repository, so this
# is not the only line of defence — but it is not redundant either: it walks
# the whole history rather than watching new pushes, and it verifies a
# candidate against its provider instead of matching a pattern.
#
# fetch-depth: 0 because a secret that was committed and then removed is
# still in the history, and still leaked.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false # the scan only reads the local history

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # The action runs the scanner as a container image whose tag defaults
          # to `latest`; pinning the action's SHA does not pin the scanner.
          version: 3.97.4
          # verified: the credential was checked against its provider and works.
          # unknown: could not be checked — reported rather than dropped, because
          # "we could not verify it" is not the same as "it is not a secret".
          extra_args: --results=verified,unknown
