name: Secret Leaks

# GitHub's own secret scanning is enabled on this public repository, so this
# is not the only line of defence — but it is not redundant either: it walks
# the whole history rather than watching new pushes, and it verifies a
# candidate against its provider instead of matching a pattern.
#
# fetch-depth: 0 because a secret that was committed and then removed is
# still in the history, and still leaked.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: Scan history for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # the scan only reads the local history

      - name: Secret scanning
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # The action runs the scanner as a container image whose tag defaults
          # to `latest`; pinning the action's SHA does not pin the scanner.
          version: 3.97.4
          # verified: the credential was checked against its provider and works.
          # unknown: could not be checked — reported rather than dropped, because
          # "we could not verify it" is not the same as "it is not a secret".
          #
          # The exclude file names exact paths, never directories: files whose
          # history carries dummy user:password URLs (fake hosts) that
          # credential-redaction tests need. Today that is the reconciler package
          # deleted in B63 (two files) and the converter's model tests. A pushed
          # branch has no `before` commit, so its run scans the whole history,
          # where those fixtures stay even after a file changes. Never quote such
          # a URL literally in a comment: this scan flags it. Anything added
          # anywhere else is still scanned, and GitHub's own secret scanning
          # still watches the excluded files.
          extra_args: --results=verified,unknown --exclude-paths=.github/trufflehog-exclude-paths.txt
