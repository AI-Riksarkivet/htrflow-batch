name: Security

# Trivy over the images this repository builds, on a schedule. ci.yml
# already gates CRITICAL findings when a change lands on main, but an image's
# CVE surface moves when advisories are published, not when this repository
# is edited — a weekly run is what catches that.
#
# Each job first writes the CRITICAL/HIGH report, unfixed findings included,
# to the Security tab (`dagger call scan-sarif`), then runs the same CRITICAL
# gate as ci.yml, so a new critical fails the scheduled run. On a push the
# gate is skipped — ci.yml has just run it — and the report is refreshed so
# alerts a dependency bump fixed are closed.
#
# Those jobs rebuild from main's source, which says what the NEXT release
# will carry. The published jobs below scan what clusters run: the digests
# this commit pins (the chart's web image, the demo pipeline's wrapper, the
# Argo CD hook's converter), pulled from the registry by reference, on both
# architectures, and re-check their signatures against the chart's own
# verify-images rule (audit 0923 D-5).
on:
  push:
    branches: [main]
    paths:
      - ".docker/**"
      - "uv.lock"
      - "packages/*/pyproject.toml"
      - "frontend/bun.lock"
      - ".github/workflows/security.yml"
      # The release pins (.dagger/published.go, publishedPins).
      - "charts/htrflow-batch/values.yaml"
      - "packages/converter/src/htrflow_converter/template/pipelines/demo-v1.yaml"
      - "packages/converter/src/htrflow_converter/template/argocd/apply.yaml"
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, before the working week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            gate: scan-web
          - image: wrapper
            gate: scan
          - image: campaigns
            gate: scan-campaigns
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: Trivy report (SARIF)
        run: |
          dagger call --progress plain scan-sarif --image "$IMAGE" \
            export --path "./trivy-${IMAGE}.sarif"
        env:
          IMAGE: ${{ matrix.image }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Upload the SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image }}
          path: ./trivy-${{ matrix.image }}.sarif
          if-no-files-found: error

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ./trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Trivy gate (CRITICAL blocks)
        if: github.event_name != 'push'
        run: dagger call --progress plain "$GATE" --severity CRITICAL --ignore-unfixed
        env:
          GATE: ${{ matrix.gate }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # The arm64 wrapper (finding 3060), built the way ci.yml and publish.yml
  # build it -- plain `docker build` on a native arm64 runner -- and scanned
  # through `make scan-image`: the same report and the same gate as above.
  scan-wrapper-arm64:
    name: Scan image (wrapper, arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      security-events: write
    env:
      SCAN_IMAGE: htrflow-batch:scan-arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the wrapper, htrflow base included (no push)
        run: docker build -f .docker/htrflow-batch.dockerfile -t "$SCAN_IMAGE" .

      - name: Trivy report (SARIF)
        run: >-
          make scan-image SCAN_SEVERITY=CRITICAL,HIGH
          SCAN_FLAGS="--format sarif --output /out/trivy-wrapper-arm64.sarif"

      - name: Upload the SARIF as an artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-wrapper-arm64
          path: ./trivy-wrapper-arm64.sarif
          if-no-files-found: error

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ./trivy-wrapper-arm64.sarif
          category: trivy-wrapper-arm64

      - name: Trivy gate (CRITICAL blocks)
        if: github.event_name != 'push'
        run: make scan-image

  # The published digests, by reference. A gate on every event, push
  # included: on a push it is the release commit's new pins being checked,
  # and ci.yml scans nothing published.
  scan-published:
    name: Scan published image (${{ matrix.image }}, ${{ matrix.platform }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [web, wrapper, campaigns]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: Trivy gate on the pinned digest (CRITICAL blocks)
        run: >-
          dagger call --progress plain scan-published --image "$IMAGE"
          --platform "$PLATFORM" --severity CRITICAL --ignore-unfixed
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # The signatures on the same digests, through the chart's verify-images
  # rule as values-prod.yaml renders it. ci.yml runs it on every change; the
  # schedule catches what moves outside this repository -- a registry that
  # drops the referrers, a signing root that rotates.
  verify-published:
    name: Verify published signatures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: The chart's signature rule admits the pinned digests
        run: dagger call --progress plain verify-published
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
