name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every gate is a dagger function so `make ci` and this workflow run the same
# thing (audit X11). `checks` = ruff + ty + campaign browser (svelte-check,
# vitest, build) + chart (helm lint/template on defaults and ci/full-values,
# kubeconform); `test` = the workspace pytest suite.
jobs:
  ci:
    name: Checks and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false # nothing here pushes; the token would outlive the step

      - uses: ./.github/actions/setup-dagger

      - name: Checks (ruff, ty, frontend, chart)
        run: dagger call --progress plain checks
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Tests (pytest)
        run: dagger call --progress plain test
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # Non-test line budgets (spec §1); the current numbers and the reason
      # for each raise live in scripts/loc-budget.sh itself.
      - name: LOC budget
        run: scripts/loc-budget.sh

  # The Go tests of the dagger module that need no engine: publishcheck reads
  # PublishDocker's gate order from the syntax tree (a commented-out gate is
  # not in the tree). It imports only the standard library, so it runs
  # without the generated dagger SDK and without downloading a module; the
  # dagger jobs above never run `go test`, so without this job it ran nowhere.
  dagger-go:
    name: Dagger module (go vet, go test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The toolchain the module declares; no cache -- nothing is downloaded.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .dagger/go.mod
          cache: false

      - name: go vet and go test (publishcheck)
        working-directory: .dagger
        run: go vet ./publishcheck/ && go test ./publishcheck/

  # The documentation site, the way docs.yml publishes it -- docs_lint (no
  # ids, dates, versions or hosts in the site) and the strict zensical
  # build -- but on every pull request, and without deploying. docs.yml ran
  # both on main only, so a broken link or a lint hit was found after the
  # merge, by the deploy (audit 0923 T-7).
  docs:
    name: Documentation (lint and strict build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # zensical from uv.lock's `docs` group, as in docs.yml.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked --only-group docs
      - run: ZENSICAL="$PWD/.venv/bin/zensical" scripts/docs-site.sh build --clean --strict

  # The chart's signature rule (verify-images, as values-prod.yaml renders
  # it) against the three digests this commit pins, through the Kyverno CLI
  # and the real registry. Offline tests can pin the rule's shape but not
  # whether it matches what the release actually signs; this can, and a
  # change to either side fails here before it lands (audit 0923 D-1).
  verify-published:
    name: Verify published signatures
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: The chart's signature rule admits the pinned digests
        run: dagger call --progress plain verify-published
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # Trivy (digest-pinned in .dagger/main.go) over the images this repo
  # builds, blocking on CRITICAL (audit T6/X16). Each scan builds its image
  # first and both builds are expensive — the wrapper carries the ~10 GB
  # CUDA base, and since B63 Task 17 the web image clones and npm-builds
  # Universal Viewer and bun-builds the SPA — so they run on pushes to main
  # and manual runs only, not on every pull request. A PR changing a
  # dockerfile therefore gets its scan when it lands; nothing a PR can
  # change reaches a cluster before that.
  #
  # One job each, not two steps in one job: they build unrelated images, and
  # as two steps a failure in the first (the UV4 clone, say) meant the other
  # image was never even built — the amd64 wrapper build silently stopped
  # being exercised.
  scan-web:
    name: Vulnerability scan (web)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: Scan the web image (CRITICAL blocks)
        run: dagger call --progress plain scan-web --severity CRITICAL --ignore-unfixed
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # The converter image the Argo CD hook runs. Unlike the web and wrapper it is
  # a small distroless build with nothing to clone, so it is scanned on pull
  # requests too: a change that brings in a critical fails before it lands.
  scan-campaigns:
    name: Vulnerability scan (campaigns)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: Scan the campaigns image (CRITICAL blocks)
        run: dagger call --progress plain scan-campaigns --severity CRITICAL --ignore-unfixed
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # Also the amd64 half of the wrapper dockerfile's proof: this is the only
  # job that builds the wrapper on amd64, and it runs the driver test on it.
  scan-wrapper:
    name: Vulnerability scan (wrapper, amd64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-dagger

      - name: Scan the wrapper image (CRITICAL blocks)
        run: dagger call --progress plain scan --severity CRITICAL --ignore-unfixed
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      # The level-0 library-API pin against the amd64 image (finding 3104).
      # It used to run only against the arm64 image below, and the amd64
      # image, then built on the upstream htrflow image, failed it. Same
      # engine, same build as the scan above, so this costs the test and
      # not a second build.
      - name: Library-API pin test (wrapper, amd64)
        run: dagger call --progress plain test-driver
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

  # The wrapper image on the OTHER architecture, built exactly the way
  # publish.yml builds it, with plain `docker build` on a native arm64
  # runner (free for public repositories). Nothing is pushed — this job
  # exists so a break in the recipe on this architecture shows up here
  # instead of in a publish run or on the node.
  #
  # Unlike the scans it runs on pull requests too: measured at 2 m 51 s
  # end to end (the htrflow stages 1 m 50 s, the wrapper 40 s), cheaper than the
  # `checks` job. Both architectures of a dockerfile change are therefore
  # proven before it lands, not after.
  build-arm64:
    name: Wrapper image (native arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build the wrapper, htrflow base included (no push)
        run: docker build -f .docker/htrflow-batch.dockerfile -t htrflow-batch:ci-arm64 .

      # The level-0 library-API pin (packages/wrapper/tests/test_driver_real.py):
      # the real htrflow Pipeline.from_config / Export / auto_import on a
      # one-page CPU fixture, inside the image the step above built. It ran in
      # no workflow at all until now — the canary for an htrflow release that
      # moves the API the driver drives was something a person had to remember
      # to run.
      #
      # Here rather than in a job of its own, and through `make` rather than
      # `dagger call test-driver`: this job already has the image in the
      # runner's docker daemon. No GPU and no Hub: the fixture pipeline is one
      # binarization step and the run is offline.
      - name: Library-API pin test, against the image just built
        run: make test-driver-real WRAPPER_IMAGE=htrflow-batch:ci-arm64

      # The Trivy gate for this architecture (finding 3060): the dagger
      # `scan` job above builds only the amd64 image. Same severity and
      # rules as that job, and like it on pushes to main and manual runs
      # only, so an advisory published today fails main, not an unrelated
      # pull request.
      - name: Vulnerability scan (wrapper, arm64; CRITICAL blocks)
        if: github.event_name != 'pull_request'
        run: make scan-image SCAN_IMAGE=htrflow-batch:ci-arm64

      - name: What was built
        # The architecture and the htrflow commit the base stages were built from.
        run: |
          docker image inspect htrflow-batch:ci-arm64 --format \
            'arch={{.Architecture}} revision={{index .Config.Labels "se.riksarkivet.htrflow.base.revision"}}'
