name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every gate is a dagger function so `make ci` and this workflow run the same
# thing (audit X11). `checks` = ruff + ty + campaign browser (svelte-check,
# vitest, build) + chart (helm lint/template on defaults and ci/full-values,
# kubeconform); `test` = the workspace pytest suite.
jobs:
  ci:
    name: Checks and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checks (ruff, ty, frontend, chart)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: checks
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

      - name: Tests (pytest)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

      # Non-test line budgets (spec §1): wrapper 1950 (raised from 1850 for
      # the Task 11 stage split + publish.py), converter 850
      # (raised from 800 for render's --out safety check and the
      # bool/zero guards), api 400, frontend 2500, chart 700.
      - name: LOC budget
        run: scripts/loc-budget.sh

  # Trivy (digest-pinned in .dagger/main.go) over the images this repo
  # builds, blocking on CRITICAL (audit T6/X16). The read API image is
  # slim and scanned on every run; the wrapper image carries the ~10 GB
  # CUDA base and is scanned on pushes to main and manual runs only.
  scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan the read API image (CRITICAL blocks)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: scan-api --severity CRITICAL --ignore-unfixed
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

      - name: Scan the wrapper image (CRITICAL blocks)
        if: github.event_name != 'pull_request'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: scan --severity CRITICAL --ignore-unfixed
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)
