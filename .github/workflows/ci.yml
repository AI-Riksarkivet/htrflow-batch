name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # AI-Riksarkivet/htrflow commit the arm64 wrapper base is built from; the
  # same pin publish.yml carries, tracked by renovate (git-refs). See
  # .github/actions/build-htrflow-base-arm64.
  HTRFLOW_ARM64_BASE_REF: 0ede4da5493cf01ac97024558a5e4f468d5f360f
  HTRFLOW_ARM64_BASE: htrflow:v0.2.6-arm64

# Every gate is a dagger function so `make ci` and this workflow run the same
# thing (audit X11). `checks` = ruff + ty + campaign browser (svelte-check,
# vitest, build) + chart (helm lint/template on defaults and ci/full-values,
# kubeconform); `test` = the workspace pytest suite.
jobs:
  ci:
    name: Checks and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checks (ruff, ty, frontend, chart)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: checks
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

      - name: Tests (pytest)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

      # Non-test line budgets (spec §1); the current numbers and the reason
      # for each raise live in scripts/loc-budget.sh itself.
      - name: LOC budget
        run: scripts/loc-budget.sh

  # Trivy (digest-pinned in .dagger/main.go) over the images this repo
  # builds, blocking on CRITICAL (audit T6/X16). Each scan builds its image
  # first and both builds are expensive — the wrapper carries the ~10 GB
  # CUDA base, and since B63 Task 17 the web image clones and npm-builds
  # Universal Viewer and bun-builds the SPA — so they run on pushes to main
  # and manual runs only, not on every pull request. A PR changing a
  # dockerfile therefore gets its scan when it lands; nothing a PR can
  # change reaches a cluster before that.
  #
  # One job each, not two steps in one job: they build unrelated images, and
  # as two steps a failure in the first (the UV4 clone, say) meant the other
  # image was never even built — the amd64 wrapper build silently stopped
  # being exercised.
  scan-web:
    name: Vulnerability scan (web)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan the web image (CRITICAL blocks)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: scan-web --severity CRITICAL --ignore-unfixed
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

  # Also the amd64 half of the wrapper dockerfile's proof: this is the only
  # job that builds its `base-amd64` stage.
  scan-wrapper:
    name: Vulnerability scan (wrapper, amd64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Scan the wrapper image (CRITICAL blocks)
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          verb: call
          args: scan --severity CRITICAL --ignore-unfixed
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          version: "0.20.3" # = engineVersion in dagger.json (renovate: dagger-engine)

  # The wrapper image on the OTHER architecture, built exactly the way the
  # GB10 node and publish.yml build it: the htrflow base from source at the
  # pinned commit, then the merged dockerfile's base-arm64 branch, on a
  # native arm64 runner (free for public repositories). Nothing is pushed —
  # this job exists so a break in either recipe shows up here instead of in
  # a publish run or on the node.
  #
  # Unlike the scans it runs on pull requests too: measured at 2 m 51 s
  # end to end (base 1 m 50 s, wrapper 40 s), which is cheaper than the
  # `checks` job. Both architectures of a dockerfile change are therefore
  # proven before it lands, not after.
  build-arm64:
    name: Wrapper image (native arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build the arm64 htrflow base
        id: base
        uses: ./.github/actions/build-htrflow-base-arm64
        with:
          ref: ${{ env.HTRFLOW_ARM64_BASE_REF }}
          image: ${{ env.HTRFLOW_ARM64_BASE }}

      - name: Build the wrapper on top of it (no push)
        run: |
          docker build -f .docker/htrflow-batch.dockerfile \
            --build-arg "HTRFLOW_ARM64_BASE=${HTRFLOW_ARM64_BASE}" \
            --build-arg "HTRFLOW_BASE_REVISION=${{ steps.base.outputs.revision }}" \
            -t htrflow-batch:ci-arm64 .

      - name: What was built
        # The provenance labels are inherited from the base stage the build
        # selected — proof that TARGETARCH picked base-arm64, not base-amd64.
        run: |
          docker image inspect htrflow-batch:ci-arm64 --format \
            'arch={{.Architecture}} base={{index .Config.Labels "org.opencontainers.image.base.name"}} revision={{index .Config.Labels "se.riksarkivet.htrflow.base.revision"}}'
