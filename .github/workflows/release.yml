name: Release
# A GitHub release for every v* tag. The notes are .github/release-notes.md
# (the pre-release warning, install, verify, and the three image digests read
# from Docker Hub) followed by git-cliff's list of changes since the previous
# tag (cliff.toml). The images come first: publish.yml runs by hand for the
# tag, the release commit pins their digests, and the tag goes on that commit
# (docs/development/releasing.md). A tag whose images are not on Docker Hub
# yet fails here rather than publishing notes that point at nothing.
#
# Attached to the release: both charts packaged at the tag (named by their
# chart version, which is not the tag's), a SHA256SUMS over them, a keyless
# cosign signature bundle (<file>.sigstore.json) for each of those, and the
# SLSA build provenance of the packages (provenance.intoto.jsonl). The
# release is only created once all of them exist.
#
# Backfill: a release made before its assets were, run by hand from main with
# the tag as input, gets the packages, checksums and signatures attached. Not
# the provenance: a run from main would record main's commit as the source,
# and the packages are the tag's.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release (v<version>) to attach the signed chart packages to
        required: true
        type: string

permissions: {}

jobs:
  charts:
    # Only from main or a tag push: the signing identity is this workflow at
    # that ref, and that is what the verification recipe anchors to.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tag
      id-token: write # keyless cosign signatures and the provenance attestation
      attestations: write # store the provenance with the repository
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # The helm the dagger module lints and renders with (.dagger/main.go helmImage).
      HELM_IMAGE: alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Package the charts
        run: |
          set -euo pipefail
          app=$(awk -F'"' '/^appVersion:/ {print $2}' charts/htrflow-batch/Chart.yaml)
          if [ "v${app}" != "$TAG" ]; then
            echo "::error::charts/htrflow-batch appVersion ${app} is not ${TAG#v}"
            exit 1
          fi
          mkdir dist
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD/charts:/charts:ro" -v "$PWD/dist:/dist" "$HELM_IMAGE" \
            package /charts/htrflow-batch /charts/htrflow-devstack --destination /dist
          cd dist
          sha256sum -- *.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign (keyless, Sigstore)
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *.tgz SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - name: Build provenance attestation
        id: provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Provenance as a release asset
        if: github.event_name == 'push'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.intoto.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 5

  release:
    needs: charts
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff reads the history back to the previous tag
          persist-credentials: false # the release is created through gh with its own token
      # git-cliff comes from uv.lock's `release` group: pinned and hash-checked.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv sync --locked --only-group release
      - name: Image digests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for pair in htrflow-batch:WRAPPER_DIGEST htrflow-web:WEB_DIGEST htrflow-campaigns:CAMPAIGNS_DIGEST; do
            repo=${pair%%:*} var=${pair##*:}
            token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:riksarkivet/${repo}:pull" | jq -r .token)
            digest=$(curl -fsSI -H "Authorization: Bearer ${token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
              "https://registry-1.docker.io/v2/riksarkivet/${repo}/manifests/${TAG}" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
            if [ -z "$digest" ]; then
              echo "::error::riksarkivet/${repo}:${TAG} is not on Docker Hub -- run publish.yml for the tag first"
              exit 1
            fi
            echo "${var}=${digest}" >> "$GITHUB_ENV"
          done
      - name: Notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chart=$(awk '/^version:/ {print $2}' charts/htrflow-batch/Chart.yaml)
          sed -e "s|@TAG@|${TAG}|g" \
              -e "s|@CHART_VERSION@|${chart}|g" \
              -e "s|@WRAPPER_DIGEST@|${WRAPPER_DIGEST}|g" \
              -e "s|@WEB_DIGEST@|${WEB_DIGEST}|g" \
              -e "s|@CAMPAIGNS_DIGEST@|${CAMPAIGNS_DIGEST}|g" .github/release-notes.md > notes.md
          .venv/bin/git-cliff --latest --strip header >> notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Below 1.0 every release is a pre-release (README: not for use yet).
          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" --verify-tag $pre --title "$TAG" --notes-file notes.md dist/*

  backfill:
    needs: charts
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the existing release; nothing else
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        # No --clobber: an asset already on the release stops the run rather
        # than replacing a signed file.
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
