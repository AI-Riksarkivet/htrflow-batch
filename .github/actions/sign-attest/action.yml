name: Sign and attest
description: >
  Everything that happens to an image after it is pushed: a keyless cosign
  signature over its digest (what the chart's security.verifyImages
  verifies), a SLSA build-provenance attestation, and — unless the subject is
  a manifest list, whose per-arch images already carry their own — a
  Trivy-generated SPDX SBOM attestation. Three jobs in publish.yml need this
  and they must not drift, so it lives here once.
  The calling job needs `id-token: write` and `attestations: write`.

inputs:
  image:
    description: Image repository reference without a tag, e.g. docker.io/riksarkivet/htrflow-batch
    required: true
  digest:
    description: The pushed digest to sign (sha256:…)
    required: true
  sbom:
    description: Generate and attest an SBOM ("false" for a manifest list)
    required: false
    default: "true"
  registry-username:
    description: Registry username for Trivy's pull of the subject image
    required: false
    default: ""
  registry-password:
    description: Registry password/token for the same
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign the digest (keyless, Sigstore)
      shell: bash
      run: cosign sign --yes "${IMAGE}@${DIGEST}"
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}

    - name: Build provenance attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true

    - name: SBOM (Trivy, SPDX)
      # Trivy runs in its own container: pass registry credentials so a
      # private (or freshly auto-created) Docker Hub repository still scans.
      if: inputs.sbom == 'true'
      shell: bash
      run: |
        docker run --rm -v "$PWD:/out" \
          -e TRIVY_USERNAME -e TRIVY_PASSWORD \
          aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
          image --skip-version-check --format spdx-json --output /out/sbom.spdx.json \
          "${IMAGE}@${DIGEST}"
      env:
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        TRIVY_USERNAME: ${{ inputs.registry-username }}
        TRIVY_PASSWORD: ${{ inputs.registry-password }}

    - name: SBOM attestation
      if: inputs.sbom == 'true'
      uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        sbom-path: sbom.spdx.json
        push-to-registry: true
