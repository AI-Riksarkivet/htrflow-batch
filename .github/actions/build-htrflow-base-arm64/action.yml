name: Build the arm64 htrflow base
description: >
  The wrapper's arm64 base image. There is no published arm64
  airiksarkivet/htrflow — the upstream image is amd64-only — so the base is
  built from source on the arm64 runner: clone AI-Riksarkivet/htrflow at a
  pinned commit and build it with this repository's
  .docker/htrflow-base.dockerfile and the lockfile committed beside it
  (finding 3060: every image by digest, dependencies synced --locked, nothing
  resolved at build time). Exactly what `make build-htrflow-base-arm64` does
  on the GB10 node, from a throwaway checkout.
  Only ever run on a native arm64 runner: the CUDA base and torch resolve
  per architecture and uv segfaults under qemu.

inputs:
  ref:
    description: Commit SHA of AI-Riksarkivet/htrflow to build
    required: true
  image:
    description: Local tag to give the base image
    required: false
    default: htrflow:v0.2.6-arm64
  dir:
    description: Where to clone
    required: false
    default: /tmp/htrflow-base

outputs:
  revision:
    description: "`git describe` of the clone — the HTRFLOW_BASE_REVISION to stamp"
    value: ${{ steps.build.outputs.revision }}

runs:
  using: composite
  steps:
    # The base plus the wrapper on top is >12 GB of images and layers, so
    # this used to reclaim the runner's unused language runtimes first. It
    # does not need to: measured on ubuntu-24.04-arm, `/` is 145 GB with
    # 102 GB free after both builds. The `df -h` stays, so the day that
    # stops being true the log says so instead of the build dying on ENOSPC.
    - name: Clone and build
      id: build
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$DIR"
        git clone --filter=blob:none "$REPO_URL" "$DIR"
        git -C "$DIR" checkout --detach "$REF"
        # The clone is only the build context (pyproject.toml, src/). The
        # lock comes from this repository as the named context `lock`, so a
        # moved ref whose pyproject.toml no longer matches it fails the
        # `uv sync --locked` instead of being resolved afresh.
        docker build -f "$GITHUB_WORKSPACE/.docker/htrflow-base.dockerfile" \
          --build-context "lock=$GITHUB_WORKSPACE/.docker/htrflow-base" \
          -t "$IMAGE" "$DIR"
        echo "revision=$(git -C "$DIR" describe --tags --always)" >> "$GITHUB_OUTPUT"
        df -h /
      env:
        REPO_URL: https://github.com/AI-Riksarkivet/htrflow.git
        DIR: ${{ inputs.dir }}
        REF: ${{ inputs.ref }}
        IMAGE: ${{ inputs.image }}
