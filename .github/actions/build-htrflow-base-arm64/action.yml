name: Build the arm64 htrflow base
description: >
  The wrapper's arm64 base image. There is no published arm64
  airiksarkivet/htrflow — the upstream image is amd64-only — so the base is
  built from source on the arm64 runner: clone AI-Riksarkivet/htrflow at a
  pinned commit, lock it (its uv.lock is gitignored) and build
  docker/htrflow.dockerfile. Exactly what `make build-htrflow-base-arm64`
  does on the GB10 node, except that this checkout is throwaway, so locking
  it writes into nobody's working tree.
  Only ever run on a native arm64 runner: the CUDA base and torch resolve
  per architecture and uv segfaults under qemu.

inputs:
  ref:
    description: Commit SHA of AI-Riksarkivet/htrflow to build
    required: true
  image:
    description: Local tag to give the base image
    required: false
    default: htrflow:v0.2.6-arm64
  dir:
    description: Where to clone
    required: false
    default: /tmp/htrflow-base

outputs:
  revision:
    description: "`git describe` of the clone — the HTRFLOW_BASE_REVISION to stamp"
    value: ${{ steps.build.outputs.revision }}

runs:
  using: composite
  steps:
    # The base plus the wrapper on top is >12 GB of images and layers, and a
    # hosted runner starts with ~14 GB free. Reclaim the language runtimes
    # nothing here uses; the before/after `df` is in the log when it is not
    # enough.
    - name: Reclaim runner disk
      shell: bash
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc || true
        sudo apt-get clean
        df -h /

    - name: Clone, lock and build
      id: build
      shell: bash
      run: |
        set -euo pipefail
        rm -rf "$DIR"
        git clone --filter=blob:none "$REPO_URL" "$DIR"
        git -C "$DIR" checkout --detach "$REF"
        # Locked with exactly the uv the wrapper dockerfile carries.
        docker run --rm -v "$DIR:/w" -w /w \
          ghcr.io/astral-sh/uv:0.12.6@sha256:88bc6eb1ccd4b82efd0e1b530caffabddf50dc2bf612e66c14ea25b8ee8a4d3d \
          lock
        docker build -f "$DIR/docker/htrflow.dockerfile" -t "$IMAGE" "$DIR"
        echo "revision=$(git -C "$DIR" describe --tags --always)" >> "$GITHUB_OUTPUT"
        df -h /
      env:
        REPO_URL: https://github.com/AI-Riksarkivet/htrflow.git
        DIR: ${{ inputs.dir }}
        REF: ${{ inputs.ref }}
        IMAGE: ${{ inputs.image }}
