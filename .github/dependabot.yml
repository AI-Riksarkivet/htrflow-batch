# Weekly version updates for every pin a registry can answer for, one grouped
# pull request per ecosystem (majors on their own), each through the full CI.
# Security updates are enabled in the repository settings and are not
# grouped. What stays manual, and why, is docs/development/ci.md's
# "Dependency pins" table: the htrflow base (.docker/htrflow-base/ is
# htrflow's pyproject.toml at HTRFLOW_REF plus the overlay, locked as a unit
# by `make lock-htrflow-base`, and the build refuses a pyproject.toml that is
# not exactly that), the transformers requirement files, the release digest
# pins, the dagger engine and the CRD schemas.
#
# A new release waits a week before it is proposed (cooldown), so a
# compromised or yanked release has time to be caught upstream first.
version: 2

updates:
  # SHA-pinned `uses:`: Dependabot moves the SHA and the version comment.
  # "/" reads .github/workflows; the composite actions each have a directory.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: {prefix: "chore(deps)"}
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # The workspace lock (uv.lock at the root, all three packages).
  #
  # lockfile-only: the ranges in the packages' pyproject.toml are what the
  # packages support, not what the lock happens to hold, so a bump moves the
  # lock and never raises a floor.
  #
  # huggingface-hub stays on its current major: the wrapper image installs it
  # beside each transformers line (.docker/transformers/*.txt), and the
  # default 4.x line needs huggingface-hub < 1.0; a lock on 1.x would test a
  # version the image does not run. Revisit when the default line is 5.x.
  - package-ecosystem: uv
    directory: /
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: huggingface-hub
        update-types: [version-update:semver-major]
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: {prefix: "chore(deps)"}
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  # The campaign browser, from frontend/bun.lock.
  #
  # TypeScript stays on 6: svelte-check (`bun run check`) and @sveltejs/kit
  # declare `typescript: ^5 || ^6` as their peer, and svelte-check runs
  # TypeScript 7 only beside a second install of 6 and behind its
  # experimental `--tsgo` flag. Revisit when a svelte-check release checks
  # against TypeScript 7 without that flag (its README's "TypeScript 7"
  # section, and its peer range).
  - package-ecosystem: bun
    directory: /frontend
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: {prefix: "chore(deps)"}
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  # FROM lines in .docker/*.dockerfile, tag plus digest. A new major of a
  # base image, and a new CUDA release line (the drivers the wrapper runs on
  # decide that), are deliberate changes rather than a weekly bump.
  - package-ecosystem: docker
    directory: /.docker
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: {prefix: "chore(deps)"}
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      - dependency-name: nvidia/cuda
        update-types: [version-update:semver-minor]
    groups:
      base-images:
        patterns: ["*"]

  # The dagger module. Its SDK modules move with the engine version
  # (dagger.json and .github/actions/setup-dagger), by hand.
  - package-ecosystem: gomod
    directory: /.dagger
    schedule: {interval: weekly, day: monday}
    cooldown: {default-days: 7}
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message: {prefix: "chore(deps)"}
    ignore:
      - dependency-name: github.com/dagger/*
    groups:
      dagger-module:
        patterns: ["*"]
        update-types: [minor, patch]
