# PoC-only in-cluster dependencies for charts/htrflow-batch, all off by
# default. Install into the SAME namespace as the htrflow-batch release (the
# two charts share no Helm values — they wire together by naming
# convention only, documented per key below) — see README.md.
#
# No git daemon here (there was one through B63 Task 5's first draft):
# nothing in the platform reads git:// any more — campaigns are Indexed
# Jobs rendered by packages/converter and applied by `htrflow-campaigns
# apply` (or Argo CD), not fetched in-cluster by a CronJob controller — so
# it had no consumer and was removed rather than kept as dead weight.

# RustFS's root credentials are also the S3 credentials every batch Job and
# the results bucket get, so this chart refuses to render RustFS on a
# credential nobody chose: an empty `rustfs.accessKey`/`secretKey` (generated
# fresh on every `helm template`, so the manifest you reviewed is not the one
# you install, and a template|apply flow rotates the keys out from under every
# running pod) or a value published in this repo, which is no secret at all.
# Set real credentials, or say here that this stack is a toy and you accept
# generated/known ones — which is what the PoC and the CI renders do.
devStack:
  insecureDefaults: false

# `secretName` must match charts/htrflow-batch's `s3.existingSecret` (both
# default to the same name) so the Secret this chart creates is the one the
# platform's pods already expect. `bucket` is written into that Secret as
# `S3_BUCKET`, which is where every pod takes the bucket's name from.
s3:
  bucket: htr-results
  secretName: htr-batch-s3
  # A private bucket for the image cache (converter.yaml's image_cache.bucket):
  # created by the init hook like `bucket`. Empty: none.
  imageCacheBucket: ""
  # The bucket has no anonymous read: a person reads results by logging in
  # to the web front, whose results proxy reads with that person's own store
  # keys. This is the RustFS user to log in as -- the init hook creates it
  # with a policy that allows s3:GetObject on `bucket` and nothing else (no
  # listing, no write, no other bucket). With htrflow-batch's
  # `results.keyDerivation: none`, the login form takes this name as the
  # access key and the password as the secret key.
  loginUser: htr-reader
  # The Secret (key `password`) holding that user's password. The chart
  # creates it with a random password, keeps it on uninstall and re-reads it
  # on upgrade (Helm `lookup`); the hook sets RustFS's copy from it on every
  # install and upgrade, so the Secret is the one source. `helm template`
  # has no cluster to look up and renders a fresh password each time.
  loginSecret: htr-results-login

rustfs:
  enabled: false
  # Root credentials of the in-cluster RustFS and of the generated S3
  # Secret. Empty = generated once (random, 32 chars) and re-read from the
  # existing Secret on every upgrade (Helm `lookup`); `helm template` has
  # no cluster to look up and renders fresh random values each time.
  accessKey: ""
  secretKey: ""
  nodePortS3: 30900
  console:
    enabled: false       # RustFS admin console (port 9001) — off: RUSTFS_CONSOLE_ENABLE=false, no NodePort
    nodePort: 30901
  # Sizing (O18): results ≈ 1–3 MB per page (ALTO + PAGE + JPEG + log);
  # 5Gi ≈ 2–4k pages. Nothing is ever deleted by the platform — grow the
  # PVC (local-path cannot resize; recreate) or prune old pipelines by hand.
  storage:
    size: 5Gi
    storageClass: local-path
  # Bucket setup Job (Helm post-install/upgrade hook): creates s3.bucket
  # (and s3.imageCacheBucket), the read-only policy and the s3.loginUser.
  # The image is RustFS's own client, `rc`: the admin calls need it, and the
  # AWS CLI has none. `rustfs/` is the prefix htrflow-batch's
  # security.allowedImageRepos already lists for RustFS itself.
  init:
    enabled: true
    image: rustfs/rc@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699  # v0.1.36

registry:
  enabled: false
  nodePort: 30500
  image: docker.io/library/registry@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
  # The registry runs as this uid with a read-only root filesystem. A data
  # local-path ignores fsGroup, so a PVC first written by a root-running
  # registry stays root-owned; with fixOwnership a root init container
  # chowns /var/lib/registry to runAsUser on every start (idempotent).
  # 0 = keep running as root (no init container).
  runAsUser: 1000
  fixOwnership: true
  # Sizing (O18): 60Gi ≈ 5 GPU wrapper images (~10 GB each). The registry
  # has no GC of its own: delete tags over the API, then run
  # `registry garbage-collect /etc/distribution/config.yml` in the pod.
  storage:
    size: 60Gi
    storageClass: local-path

nvidiaDevicePlugin:
  # Renders RuntimeClass `nvidia` + the kube-system device-plugin DaemonSet.
  # A cluster that already carries hand-applied copies must adopt them
  # first (see README, "Adopting hand-applied resources").
  enabled: false
  image: nvcr.io/nvidia/k8s-device-plugin@sha256:25cc340fe6fd53c101e16fc452f503e7a92c219c64a80ed5381784b522dbbf77
