{{- if .Values.nvidiaDevicePlugin.enabled }}
# GPU plumbing for a bare k3s node. Both objects are cluster-scoped or in
# kube-system: on a cluster that already carries hand-applied copies, adopt
# them first (README, "Adopting hand-applied resources") — Helm refuses to
# take over an object without its ownership annotations.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { name: nvidia-device-plugin }
  template:
    metadata:
      labels: { name: nvidia-device-plugin }
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin
          image: {{ .Values.nvidiaDevicePlugin.image }}
          imagePullPolicy: {{ include "htrflow-devstack.pullPolicy" .Values.nvidiaDevicePlugin.image }}
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
{{- end }}
