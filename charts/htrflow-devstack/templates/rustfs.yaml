{{- if .Values.rustfs.enabled }}
{{- $creds := include "htrflow-devstack.rustfsCreds" . | fromJson }}
# PoC-only in-cluster S3. Credentials come from rustfs.{accessKey,secretKey}
# or are generated once and re-read from this Secret on upgrade (audit S2);
# never enable this next to real data. The Secret name/bucket MUST match
# charts/htrflow-batch's `s3.existingSecret` / `s3.bucket` (both default to
# the same names as this chart's `s3.secretName` / `s3.bucket`) — the two
# charts are installed side by side into the same namespace, not linked by
# shared values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.secretName }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`: the bucket data on the PVC is useless
    # without the credentials that created it.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Pods read `credentials` as a mounted file (AWS_SHARED_CREDENTIALS_FILE);
  # the AWS_* keys stay for tooling (compose, the init Job) and for the
  # RustFS server itself (env valueFrom below).
  AWS_ACCESS_KEY_ID: {{ $creds.access | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.secret | quote }}
  credentials: |
    [default]
    aws_access_key_id = {{ $creds.access }}
    aws_secret_access_key = {{ $creds.secret }}
  S3_ENDPOINT: http://rustfs.{{ .Release.Namespace }}.svc.cluster.local:9000
  S3_BUCKET: {{ .Values.s3.bucket }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.rustfs.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.rustfs.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      automountServiceAccountToken: false
      # The image already runs as uid 10001 (user `rustfs`); pinned here so
      # a future image cannot silently regress to root. /data (PVC) and
      # /logs, /tmp (emptyDirs) are the only writable paths.
      securityContext:
        {{- include "htrflow-devstack.restrictedPod" 10001 | nindent 8 }}
      containers:
        - name: rustfs
          image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
          args: ["/data"]
          securityContext:
            {{- include "htrflow-devstack.restrictedContainer" . | nindent 12 }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3.secretName }}, key: AWS_ACCESS_KEY_ID }
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3.secretName }}, key: AWS_SECRET_ACCESS_KEY }
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ENABLE
              value: {{ .Values.rustfs.console.enabled | ternary "true" "false" | quote }}
          ports:
            - containerPort: 9000
            {{- if .Values.rustfs.console.enabled }}
            - containerPort: 9001
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
        - name: logs
          emptyDir: { sizeLimit: 256Mi }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: rustfs }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: {{ .Values.rustfs.nodePortS3 }}
    {{- if .Values.rustfs.console.enabled }}
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: {{ .Values.rustfs.console.nodePort }}
    {{- end }}
---
# RustFS: S3 API from anywhere (Jobs, the read API's viewer-facing origin,
# the init Job, browsers via the NodePort); the console port only when it is
# enabled. No egress. Namespace default-deny is rendered by
# charts/htrflow-batch (network.defaultDeny) — this policy is what lets
# RustFS through it when the two charts share a namespace, which is why it
# is unconditional here rather than gated on any htrflow-batch value.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-rustfs
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: rustfs }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - ipBlock: { cidr: "0.0.0.0/0" }
      ports:
        - { port: 9000 }
        {{- if .Values.rustfs.console.enabled }}
        - { port: 9001 }
        {{- end }}
{{- if .Values.rustfs.init.enabled }}
---
# Bucket setup (replaces the hand-run aws-cli pod of the PoC): idempotent,
# re-run on every install/upgrade so a policy change in values lands. Only
# creates s3.bucket — this chart has no git daemon (removed: nothing in the
# platform reads git:// any more, campaigns are applied with `kubectl` from
# rendered manifests), so there is no campaigns-repo bucket to seed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-init
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
data:
  # Generated from values via the bucketPolicy helper (see _helpers.tpl for
  # why it is an Allow with NotResource); scripts/compose_init.py mirrors it.
  results-policy.json: {{ include "htrflow-devstack.bucketPolicy" . | quote }}
  cors.json: {{ dict "CORSRules" (list (dict
      "AllowedOrigins" .Values.rustfs.init.corsOrigins
      "AllowedMethods" (list "GET" "HEAD")
      "AllowedHeaders" (list "*")
      "MaxAgeSeconds" 3600)) | toJson | quote }}
  init.sh: |
    #!/bin/sh
    set -eu
    ep="$S3_ENDPOINT"
    for i in $(seq 1 60); do
      aws --endpoint-url "$ep" s3api list-buckets >/dev/null 2>&1 && break
      echo "waiting for rustfs ($i)"; sleep 2
    done
    ensure_bucket() {
      aws --endpoint-url "$ep" s3api head-bucket --bucket "$1" >/dev/null 2>&1 \
        || aws --endpoint-url "$ep" s3api create-bucket --bucket "$1" >/dev/null
    }
    ensure_bucket "$S3_BUCKET"
    aws --endpoint-url "$ep" s3api put-bucket-policy --bucket "$S3_BUCKET" --policy file:///init/results-policy.json
    aws --endpoint-url "$ep" s3api put-bucket-cors --bucket "$S3_BUCKET" --cors-configuration file:///init/cors.json
    echo "rustfs init complete"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: rustfs-init }   # NetworkPolicy selector (below)
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- include "htrflow-devstack.restrictedPod" 1000 | nindent 8 }}
      containers:
        - name: aws
          image: {{ .Values.rustfs.init.image }}
          imagePullPolicy: {{ include "htrflow-devstack.pullPolicy" .Values.rustfs.init.image }}
          command: ["/bin/sh", "/init/init.sh"]
          securityContext:
            {{- include "htrflow-devstack.restrictedContainer" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /secrets/s3/credentials
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3.secretName }}, key: S3_ENDPOINT }
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3.secretName }}, key: S3_BUCKET }
          volumeMounts:
            - { name: init, mountPath: /init, readOnly: true }
            - { name: s3, mountPath: /secrets/s3, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      volumes:
        - name: init
          configMap: { name: rustfs-init }
        - name: s3
          secret: { secretName: {{ .Values.s3.secretName }}, defaultMode: 0440 }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# Bucket init hook Job: only RustFS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-rustfs-init
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-devstack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: rustfs-init }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector: { matchLabels: { app: rustfs } }
      ports:
        - { port: 9000 }
{{- end }}
{{- end }}
