# Every optional feature on, for `helm lint -f` / `helm template -f` /
# kubeconform in CI. No cluster is needed.
# No credentials are set: a value written here would be published, and the
# render refuses one of those whatever else is set. Empty keys are generated
# per render, which this accepts (charts/htrflow-devstack/values.yaml, devStack).
devStack:
  insecureDefaults: true

s3:
  bucket: htr-results
  secretName: htr-batch-s3

rustfs:
  enabled: true
  console:
    enabled: true

registry:
  enabled: true

nvidiaDevicePlugin:
  enabled: true

# The development Keycloak needs passwords no flag invents. These two are
# render placeholders, published here and so no secret: ci/ is never an
# install and is not packaged (charts/htrflow-devstack/README.md, Keycloak).
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
  adminPassword: ci-render-placeholder
  userPassword: ci-render-placeholder
