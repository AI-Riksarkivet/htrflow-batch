# Every optional feature on, for `helm lint -f` / `helm template -f` /
# kubeconform in CI. No cluster is needed.
# No credentials are set: a value written here would be published, and the
# render refuses one of those whatever else is set. Empty keys are generated
# per render, which this accepts (charts/htrflow-devstack/values.yaml, devStack).
devStack:
  insecureDefaults: true

s3:
  bucket: htr-results
  secretName: htr-batch-s3

rustfs:
  enabled: true
  console:
    enabled: true

registry:
  enabled: true

nvidiaDevicePlugin:
  enabled: true
