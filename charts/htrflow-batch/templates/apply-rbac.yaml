{{- if .Values.apply.rbac.enabled }}
# An identity for `htrflow-campaigns apply` (packages/converter) when it runs
# INSIDE the cluster — an Argo CD PostSync hook, a CI Job — instead of from
# an operator's kubeconfig. Off by default: on a PoC the command runs from a
# laptop, and an unused ServiceAccount that may delete Jobs is a liability.
#
# The verbs are exactly what packages/converter/src/htrflow_converter
# cluster.py issues: server-side apply is a PATCH, the prune is a `list` plus
# a `delete`, and the Kueue pause sync `list`s Workloads and `patch`es one
# `spec.active`. `create` on jobs/configmaps is there because an apply-patch
# whose object does not exist yet is authorized as BOTH `patch` and `create`
# — measured on the PoC, `patch` alone gives "cannot create resource" on the
# first apply and works on every later one (docs/development
# /e2e-indexed-jobs.md, Task 21). Workloads are only ever patched, never
# created, so they need no `create`. No ClusterRole and no `watch`: one
# namespace, no informers.
#
# `get` on jobs and configmaps is B76: before it applies anything, the
# command reads each campaign's live Job to record how it ended, and reads
# the record back to leave a finished campaign alone instead of re-running
# every volume. `list` does not cover a read by name.
#
# Two more writes the command makes. It holds the coordination Lease
# `htrflow-campaigns-apply` for its whole run, so two applies never
# interleave, and it fails closed without one: `create` on leases (RBAC
# cannot scope a create by name) and `get`/`update` on that one Lease. And
# on an unpause it patches the Job under a second field manager,
# `htrflow-campaigns-suspend`, handing `spec.suspend` over to Kueue -- the
# same `patch` on jobs, and the same admission rules (rbac-scope,
# job-shape) as every other write it makes.
#
# This grants delete on Jobs in the release namespace, which is what --prune
# is. Bind it to the campaigns pipeline and nothing else.
#
# One read beyond the namespace (B105): a campaign at a size with a flavor
# goes out only while converter.yaml's `flavors` are the ClusterQueue's, so
# the command gets this release's LocalQueue, its ClusterQueue and each of
# its ResourceFlavors -- by name, read-only, nothing else cluster-scoped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: htrflow-campaigns
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: htrflow-campaigns
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "delete"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["list", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["htrflow-campaigns-apply"]
    verbs: ["get", "update"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["localqueues"]
    resourceNames: [{{ .Values.queue.name | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: htrflow-campaigns
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: htrflow-campaigns
subjects:
  - kind: ServiceAccount
    name: htrflow-campaigns
    namespace: {{ .Release.Namespace }}
{{- $flavors := list .Values.queue.flavor }}
{{- with .Values.queue.flavors }}{{ $flavors = list }}{{ range . }}{{ $flavors = append $flavors .name }}{{ end }}{{ end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: htrflow-campaigns-queue-{{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues"]
    resourceNames: [{{ .Values.queue.clusterQueueName | default (printf "%s-cq" .Values.queue.name) | quote }}]
    verbs: ["get"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["resourceflavors"]
    resourceNames: {{ toJson $flavors }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: htrflow-campaigns-queue-{{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: htrflow-campaigns-queue-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: htrflow-campaigns
    namespace: {{ .Release.Namespace }}
{{- if .Values.network.enabled }}
---
# An identity with no route to the API server is not an identity
# (2026-09-14, audit): under this chart's own namespace default deny, an
# apply pod had its ServiceAccount and nowhere to send a request, so the
# command hung to its deadline with nothing in the log to say why. Label the
# Job's pod `app: htrflow-campaigns` for this to apply to it.
#
# DNS and the API server, and nothing else: `apply` reads its campaigns from
# a directory it was given, never from a network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-campaigns-apply
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-campaigns }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - {{ include "htrflow-batch.apiServerEgress" . }}
    {{- with .Values.apply.gitCidrs }}
    - to: {{ include "htrflow-batch.egressTo" (list $ .) }}
      ports:
        {{- range $.Values.apply.gitPorts }}
        - { port: {{ . }} }
        {{- end }}
    {{- end }}
{{- end }}
{{- end }}
