{{- if .Values.exampleJob.enabled }}
# Task 10 smoke Job for the real htrflow-batch image against a mocked IIIF
# manifest — a one-off PoC replay aid, not a production submission path
# (per-volume Jobs are submitted at runtime by the orchestrator, not by this
# chart).
apiVersion: batch/v1
kind: Job
metadata:
  name: htr-vol-301
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: htrflow-batch
    batch.htrflow/volume: mock-vol
    kueue.x-k8s.io/queue-name: {{ .Values.queue.name }}
spec:
  suspend: true
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels: { app: htrflow-batch }
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      containers:
        - name: wrapper
          image: {{ .Values.exampleJob.image | required "exampleJob.image is required when exampleJob.enabled" }}
          env:
            - name: VOLUME_REF
              value: mock-vol
            - name: IIIF_MANIFEST_URL
              value: {{ .Values.exampleJob.manifestUrl | quote }}
            - name: PIPELINE_PATH
              value: /config/pipeline.yaml
            - name: PIPELINE_ID
              value: {{ .Values.exampleJob.pipelineId }}
            - name: PUBLIC_RESULTS_BASE
              value: {{ .Values.publicResultsBase | quote }}
            - name: HF_HOME
              value: /data/hf
            - name: WORKDIR_PATH
              value: /work
          envFrom:
            - secretRef: { name: {{ .Values.s3.existingSecret }} }
          volumeMounts:
            - name: pipeline
              mountPath: /config
            - name: data
              mountPath: /data
            - name: work
              mountPath: /work
          resources:
            requests: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
      volumes:
        - name: pipeline
          configMap: { name: htr-pipeline-{{ .Values.exampleJob.pipelineId }} }
        - name: data
          persistentVolumeClaim: { claimName: htr-test-data }
        - name: work
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
{{- end }}
