{{- if .Values.exampleJob.enabled }}
# Task 10 smoke Job for the real htrflow-batch image against a mocked IIIF
# manifest — a one-off PoC replay aid, not a production submission path
# (per-volume Jobs are submitted at runtime by the orchestrator, not by this
# chart). Mirrors reconciler/jobspec.py:build_job — keep the two in step.
# Warm the pipeline's models first: `make warmup PIPELINE=<id> IMAGE=<ref>`.
apiVersion: batch/v1
kind: Job
metadata:
  name: htr-vol-301
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: htrflow-batch
    batch.htrflow/volume: mock-vol
    kueue.x-k8s.io/queue-name: {{ .Values.queue.name }}
spec:
  suspend: true
  # backoffLimit 0 + podFailurePolicy (contract, plan 2026-08-26): a node
  # drain/preemption is not a failure and does not consume the one attempt;
  # the wrapper's exit 13 (permanent) fails the Job outright.
  backoffLimit: 0
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailJob
        onExitCodes:
          containerName: wrapper
          operator: In
          values: [13]
  activeDeadlineSeconds: {{ .Values.job.minDeadlineSeconds }}
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels: { app: htrflow-batch }
    spec:
      restartPolicy: Never
      {{- with .Values.job.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.job.nodeSelector }}
      nodeSelector: {{ toJson . }}
      {{- end }}
      {{- with .Values.job.tolerations }}
      tolerations: {{ toJson . }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "htrflow-batch.restrictedPod" 1000 | nindent 8 }}
      containers:
        - name: wrapper
          image: {{ .Values.exampleJob.image | required "exampleJob.image is required when exampleJob.enabled" }}
          securityContext:
            {{- include "htrflow-batch.restrictedContainer" . | nindent 12 }}
          env:
            - name: VOLUME_REF
              value: mock-vol
            - name: IIIF_MANIFEST_URL
              value: {{ .Values.exampleJob.manifestUrl | quote }}
            - name: PIPELINE_PATH
              value: /config/pipeline.yaml
            - name: PIPELINE_ID
              value: {{ .Values.exampleJob.pipelineId }}
            - name: PUBLIC_RESULTS_BASE
              value: {{ .Values.publicResultsBase | quote }}
            - name: HF_HOME
              value: /data/hf
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: WORKDIR_PATH
              value: /work
            - name: HOME
              value: /work/home
            - name: TMPDIR
              value: /work/tmp
            - name: YOLO_CONFIG_DIR
              value: /work/ultralytics
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /secrets/s3/credentials
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: S3_ENDPOINT, optional: true }
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: S3_BUCKET }
          volumeMounts:
            - name: pipeline
              mountPath: /config
            - name: data
              mountPath: /data
              readOnly: true
            - name: work
              mountPath: /work
            - name: s3
              mountPath: /secrets/s3
              readOnly: true
          resources:
            requests: { cpu: "4", memory: 8Gi, nvidia.com/gpu: "1" }
            limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: "1" }
      volumes:
        - name: pipeline
          configMap: { name: htr-pipeline-{{ .Values.exampleJob.pipelineId }} }
        - name: data
          persistentVolumeClaim: { claimName: {{ .Values.modelCache.name }} }
        - name: work
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
        - name: s3
          secret: { secretName: {{ .Values.s3.existingSecret }}, defaultMode: 0440 }
{{- end }}
