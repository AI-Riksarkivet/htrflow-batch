{{- /*
Three kinds here are cluster-scoped with names of their own -- the
ResourceFlavor, the ClusterQueue and the WorkloadPriorityClasses -- so a
second release, or a cluster whose Kueue already has one of them, would fail
Helm's ownership check (0923 D-9). Each is created by this release or only
referenced by name: `queue.createFlavor`, `queue.createClusterQueue`,
`queue.createPriorityClasses`, with the names as values.
*/}}
{{- $cq := .Values.queue.clusterQueueName | default (printf "%s-cq" .Values.queue.name) }}
{{- /*
`queue.flavors` (B104): one flavor per sort of GPU, picked by its node labels,
with a quota of its own. Unset, `queue.flavor` and `queue.resources` are the
one flavor, with no spec, exactly as before. A flavor's taints are its
tolerations too: Kueue adds those to every pod it admits there, beside the
node labels as the pod's node selector.
*/}}
{{- $flavors := list (dict "name" .Values.queue.flavor "resources" .Values.queue.resources) }}
{{- with .Values.queue.flavors }}
{{- $flavors = list }}
{{- range . }}
{{- $quota := .quota }}
{{- $resources := list }}
{{- range list "cpu" "memory" "nvidia.com/gpu" }}{{ $resources = append $resources (dict "name" . "quota" (index $quota .)) }}{{ end }}
{{- $tolerations := list }}
{{- range .nodeTaints }}{{ $tolerations = append $tolerations (merge (dict "operator" (ternary "Equal" "Exists" (not (empty .value)))) .) }}{{ end }}
{{- $flavors = append $flavors (dict "name" .name "nodeLabels" .nodeLabels "nodeTaints" .nodeTaints "tolerations" $tolerations "resources" $resources) }}
{{- end }}
{{- end }}
{{- if .Values.queue.createFlavor }}
{{- range $flavors }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: {{ .name }}
  labels: {{- include "htrflow-batch.labels" $ | nindent 4 }}
{{- if .nodeLabels }}
spec:
  nodeLabels: {{- toYaml .nodeLabels | nindent 4 }}
  {{- if .nodeTaints }}
  nodeTaints: {{- toYaml .nodeTaints | nindent 4 }}
  tolerations: {{- toYaml .tolerations | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- end }}
{{- end }}
{{- if .Values.queue.createClusterQueue }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: {{ $cq }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  # Only LocalQueues in the release namespace may borrow this quota (audit
  # S9); a ClusterQueue is cluster-scoped, an empty selector admits any
  # namespace that points a LocalQueue at it.
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  resourceGroups:
    # One group; Kueue tries its flavors in this order.
    - coveredResources: [{{ range $i, $r := (first $flavors).resources }}{{ if $i }}, {{ end }}{{ $r.name | quote }}{{ end }}]
      flavors:
        {{- range $flavors }}
        - name: {{ .name }}
          resources:
            {{- range .resources }}
            - name: {{ .name | quote }}
              nominalQuota: {{ .quota }}
            {{- end }}
        {{- end }}
---
{{- end }}
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: {{ .Values.queue.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  clusterQueue: {{ $cq }}
{{- /*
One cluster-scoped WorkloadPriorityClass per queue.priorityClasses entry, on
the same API version as the queue objects above. `value` and `description`
sit at the top level of this kind, not under a spec. Nothing here turns
preemption on: a class only decides who is admitted next. With
createPriorityClasses false the list still names the classes the cluster
has, which converter.yaml's `priority_classes` must repeat.
*/}}
{{- if .Values.queue.createPriorityClasses }}
{{- range .Values.queue.priorityClasses }}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: WorkloadPriorityClass
metadata:
  name: {{ .name }}
  labels: {{- include "htrflow-batch.labels" $ | nindent 4 }}
value: {{ int .value }}
description: {{ .description | quote }}
{{- end }}
{{- end }}
