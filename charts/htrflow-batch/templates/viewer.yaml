{{- if .Values.viewer.enabled }}
# UV4 viewer (D19) — static nginx site on NodePort {{ .Values.viewer.nodePort }}.
# Open a volume with:
#   http://<node>:{{ .Values.viewer.nodePort }}/uv.html#?manifest=<PUBLIC_RESULTS_BASE>/<pipeline>/<volume>/iiif.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: uv4-viewer-nginx
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;
      absolute_redirect off;  # keep Location relative so the NodePort survives
      {{- if .Values.viewer.defaultManifest }}
      location = / {
        return 302 /uv.html#?manifest={{ .Values.viewer.defaultManifest }};
      }
      {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uv4-viewer
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: uv4-viewer
spec:
  replicas: 1
  selector:
    matchLabels: { app: uv4-viewer }
  template:
    metadata:
      labels: { app: uv4-viewer }
    spec:
      containers:
        - name: nginx
          image: {{ .Values.viewer.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: uv4-viewer-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: uv4-viewer
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: uv4-viewer
spec:
  type: NodePort
  selector: { app: uv4-viewer }
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: {{ .Values.viewer.nodePort }}
{{- end }}
