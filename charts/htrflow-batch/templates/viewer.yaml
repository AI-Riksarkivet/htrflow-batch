{{- if .Values.viewer.enabled }}
{{- include "htrflow-batch.requireDigest" (list . .Values.viewer.image "viewer.image") }}
# Viewer (D19) — static nginx site on NodePort {{ .Values.viewer.nodePort }} serving both
# the campaign browser SPA at / and UV4 at /uv.html.
# Open a volume directly with:
#   http://<node>:{{ .Values.viewer.nodePort }}/uv.html#?manifest=<PUBLIC_RESULTS_BASE>/<pipeline>/<volume>/iiif.json
# The image is nginx-unprivileged: UID 101, port 8080 (the NodePort is unchanged).
apiVersion: v1
kind: ConfigMap
metadata:
  name: uv4-viewer-nginx
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      absolute_redirect off;  # keep Location relative so the NodePort survives
      {{- if .Values.viewer.securityHeaders.enabled }}
      # Security headers (audit S4). Inherited by every location below (none
      # of them sets add_header of its own). Script/style/connect sources are
      # governed by the SvelteKit build's own CSP meta (kit.csp); the header
      # only forbids framing, which a meta tag cannot express.
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "frame-ancestors 'none'" always;
      {{- end }}
      {{- if .Values.viewer.defaultManifest }}
      # DEPRECATED single-manifest front door. Unset (the default), / serves the
      # campaign browser's index.html instead.
      location = / {
        return 302 /uv.html#?manifest={{ .Values.viewer.defaultManifest }};
      }
      {{- end }}
      # SvelteKit's static adapter emits log.html for the /log route; without
      # this, a direct visit or refresh of /log?... 404s (nginx only resolves
      # index.html for /).
      location = /log {
        try_files /log.html =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uv4-viewer
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: uv4-viewer
spec:
  replicas: 1
  selector:
    matchLabels: { app: uv4-viewer }
  template:
    metadata:
      labels: { app: uv4-viewer }
      annotations:
        # Roll the pod when the nginx config changes (a ConfigMap edit alone
        # would leave the running nginx on the old headers).
        checksum/nginx-conf: {{ .Values.viewer | toJson | sha256sum }}
    spec:
      # Static files only: no API access, Pod Security restricted (audit S8).
      automountServiceAccountToken: false
      securityContext:
        {{- include "htrflow-batch.restrictedPod" 101 | nindent 8 }}
      containers:
        - name: nginx
          image: {{ .Values.viewer.image }}
          imagePullPolicy: {{ include "htrflow-batch.pullPolicy" .Values.viewer.image }}
          securityContext:
            {{- include "htrflow-batch.restrictedContainer" . | nindent 12 }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            # nginx-unprivileged keeps its pid and every *_temp_path under
            # /tmp; /var/cache/nginx is the stock image's cache dir.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: nginx-conf
          configMap: { name: uv4-viewer-nginx }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: cache
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: uv4-viewer
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: uv4-viewer
spec:
  type: NodePort
  selector: { app: uv4-viewer }
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: {{ .Values.viewer.nodePort }}
{{- end }}
