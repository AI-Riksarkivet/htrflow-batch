{{- if .Values.devStack.rustfs.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.s3.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Pods read `credentials` as a mounted file (AWS_SHARED_CREDENTIALS_FILE);
  # the AWS_* keys stay for tooling that still uses envFrom (compose, scripts).
  AWS_ACCESS_KEY_ID: rustfsadmin
  AWS_SECRET_ACCESS_KEY: rustfsadmin
  credentials: |
    [default]
    aws_access_key_id = rustfsadmin
    aws_secret_access_key = rustfsadmin
  S3_ENDPOINT: http://rustfs.{{ .Release.Namespace }}.svc.cluster.local:9000
  S3_BUCKET: {{ .Values.s3.bucket }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: rustfs }
  template:
    metadata:
      labels: { app: rustfs }
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args: ["/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              value: rustfsadmin
            - name: RUSTFS_SECRET_KEY
              value: rustfsadmin
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: rustfs }
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: {{ .Values.devStack.rustfs.nodePortS3 }}
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: {{ .Values.devStack.rustfs.nodePortConsole }}
{{- end }}
