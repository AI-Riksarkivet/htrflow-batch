{{- if .Values.network.enabled }}
{{- /*
Egress allowlists per pod role (docs: development/security, D14) plus a
namespace-wide default deny with an explicit ingress allow for the one pod
that serves something (the web front). Nothing may reach a batch/warm-up
Job. The web front's own ingress/egress policy is rendered by
templates/web.yaml (it needs the same apiserver-CIDR lookup as this file but
nothing else here).

kube-router (k3s) evaluates egress AFTER service DNAT, so ClusterIP targets
are matched by their backing pod (podSelector) or, for the apiserver, by the
node address it resolves to — hence the `lookup` auto-detection in web.yaml.
*/}}
{{- /*
What an egress rule must not reach, and how a range carves it out, is
_helpers.tpl's (internalCidrs, egressTo): every rule here and in web.yaml
and apply-rbac.yaml goes through the same carve-out, whatever range the
operator names. A range named in iiifCidrs or s3Cidrs that lies inside a
private one stays reachable -- it is its own ipBlock.
*/}}
{{- $dns := dict "to" (list (dict
      "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system"))
      "podSelector" (dict "matchLabels" (dict "k8s-app" "kube-dns"))))
    "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
{{- $s3 := include "htrflow-batch.s3Egress" . | fromJsonArray }}
{{- $anyPublic := include "htrflow-batch.egressTo" (list . (list "0.0.0.0/0")) | fromJsonArray }}
{{- $labels := include "htrflow-batch.labels" . }}
{{- if .Values.network.defaultDeny }}
---
# Namespace default deny (audit S8): every pod starts with no ingress and no
# egress; the policies below add back exactly what each role needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-default-deny
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-allow-dns
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {{ toJson $dns }}
{{- end }}
---
# Batch Jobs (rendered by the converter, applied outside this chart): DNS, S3
# and the IIIF origin. No HF Hub, no apiserver, nothing else in-cluster — a
# compromised Job has nowhere to go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-batch-job
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-batch }
  policyTypes: [Ingress, Egress]
  egress:
    - {{ toJson $dns }}
    {{- range $s3 }}
    - {{ toJson . }}
    {{- end }}
    {{- with .Values.network.iiifCidrs }}
    {{- /* A catch-all (the PoC's 0.0.0.0/0, for images hosted off the
         IIIF origin) still reaches no cluster, node or metadata address. */}}
    - to: {{ include "htrflow-batch.egressTo" (list $ .) }}
      ports:
        - { port: 443 }
        - { port: 80 }
    {{- end }}
---
# Warm-up Jobs: the ONE pod allowed to reach HF Hub (a CDN, so: the public
# internet minus the cluster). No S3, no apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-warmup
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-warmup }
  policyTypes: [Ingress, Egress]
  egress:
    - {{ toJson $dns }}
    - to: {{ toJson $anyPublic }}
      ports:
        - { port: 443 }
{{- end }}
