{{- if .Values.network.enabled }}
{{- /*
Egress allowlists per pod role (docs: development/security, D14) plus a
namespace-wide default deny with explicit ingress allows for the pods that
serve something (viewer, the read API). Nothing may reach a batch/warm-up
Job. The read API's own ingress/egress policy is rendered by templates/web.yaml
(it needs the same apiserver-CIDR lookup as this file but nothing else here).

kube-router (k3s) evaluates egress AFTER service DNAT, so ClusterIP targets
are matched by their backing pod (podSelector) or, for the apiserver, by the
node address it resolves to — hence the `lookup` auto-detection in web.yaml.
*/}}
{{- $nodes := list }}
{{- range .Values.network.nodeCidrs }}{{ $nodes = append $nodes . }}{{ end }}
{{- if not $nodes }}
  {{- range (lookup "v1" "Node" "" "").items }}
    {{- range .status.addresses }}
      {{- if eq .type "InternalIP" }}{{ $nodes = append $nodes (printf "%s/32" .address) }}{{ end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- $internal := concat .Values.network.clusterCidrs $nodes }}
{{- $dns := dict "to" (list (dict
      "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system"))
      "podSelector" (dict "matchLabels" (dict "k8s-app" "kube-dns"))))
    "ports" (list (dict "port" 53 "protocol" "UDP") (dict "port" 53 "protocol" "TCP")) }}
{{- /*
S3 egress for batch Jobs: an in-namespace `app: rustfs` pod is always
allowed (a no-op podSelector match when charts/htrflow-devstack's RustFS
isn't installed — the two charts share no values) plus any CIDR-based real
endpoint from network.s3Cidrs.
*/}}
{{- $s3 := list (dict "to" (list (dict "podSelector" (dict "matchLabels" (dict "app" "rustfs")))) "ports" (list (dict "port" 9000))) }}
{{- if .Values.network.s3Cidrs }}
  {{- $blocks := list }}
  {{- range .Values.network.s3Cidrs }}{{ $blocks = append $blocks (dict "ipBlock" (dict "cidr" .)) }}{{ end }}
  {{- $s3 = append $s3 (dict "to" $blocks) }}
{{- end }}
{{- $anyPublic := list (dict "ipBlock" (dict "cidr" "0.0.0.0/0" "except" $internal)) }}
{{- $labels := include "htrflow-batch.labels" . }}
{{- if .Values.network.defaultDeny }}
---
# Namespace default deny (audit S8): every pod starts with no ingress and no
# egress; the policies below add back exactly what each role needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-default-deny
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve names.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-allow-dns
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - {{ toJson $dns }}
{{- end }}
---
# Batch Jobs (rendered by the converter, applied outside this chart): DNS, S3
# and the IIIF origin. No HF Hub, no apiserver, nothing else in-cluster — a
# compromised Job has nowhere to go.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-batch-job
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-batch }
  policyTypes: [Ingress, Egress]
  egress:
    - {{ toJson $dns }}
    {{- range $s3 }}
    - {{ toJson . }}
    {{- end }}
    {{- if .Values.network.iiifCidrs }}
    - to:
        {{- range .Values.network.iiifCidrs }}
        {{- if eq . "0.0.0.0/0" }}
        {{- /* PoC catch-all for images hosted outside the IIIF origin (e.g.
             Hugging Face example pages): still no cluster, node or apiserver
             reach. `except` must be a subset of `cidr`, so only here. */}}
        - ipBlock: {{ dict "cidr" . "except" $internal | toJson }}
        {{- else }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
        {{- end }}
      ports:
        - { port: 443 }
        - { port: 80 }
    {{- end }}
---
# Warm-up Jobs: the ONE pod allowed to reach HF Hub (a CDN, so: the public
# internet minus the cluster). No S3, no apiserver.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-warmup
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-warmup }
  policyTypes: [Ingress, Egress]
  egress:
    - {{ toJson $dns }}
    - to: {{ toJson $anyPublic }}
      ports:
        - { port: 443 }
{{- if .Values.viewer.enabled }}
---
# Viewer: browsers in (NodePort traffic arrives SNAT'd from the node); egress
# to the read API only (proxied at /api/).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-viewer
  namespace: {{ .Release.Namespace }}
  labels: {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: uv4-viewer }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.network.viewer.ingressCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { port: 8080 }
  egress:
    - to:
        - podSelector: { matchLabels: { app: htrflow-web } }
      ports:
        - { port: 8081 }
{{- end }}
{{- end }}
