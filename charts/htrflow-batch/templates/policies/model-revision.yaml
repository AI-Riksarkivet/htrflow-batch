{{- if and .Values.security.policies.enabled .Values.security.requireModelRevision }}
# Every model a pipeline loads is pinned to a 40-hex Hugging Face commit
# (B63 Task 22). HF Hub weights are pickles and a repo id alone is mutable,
# so an unpinned model is a code-execution hole that opens later.
#
# The subject is any ConfigMap carrying a `pipeline.yaml` key: that key is
# the htrflow steps document, parsed here with Kyverno's `parse_yaml` so the
# rule reads the structure the wrapper will. Only top-level steps are
# walked, exactly as the converter's rule did. The `|| 'steps: []'` is what
# passes every OTHER ConfigMap in the namespace straight through.
#
# It matched `managed-by: converter` until 2026-09-14 (audit), which made
# the rule skippable by anyone who can create a ConfigMap: leave the label
# off and the pipeline is admitted unpinned. A label is a claim about an
# object, not a property of it -- the `pipeline.yaml` key is the property.
# `context` + `deny` rather than `foreach` for the reason spelled out in
# images-pinned.yaml: the message names the model.
#
# A model is pinned two different ways depending on who loads it (B63 Task
# 22 fix round 2): YOLO's Ultralytics wrapper takes `model_settings.revision`
# top-level, while htrflow's Hugging Face-backed models (TrOCR, Donut, DiT)
# take it as `model_settings.model_kwargs.revision`, forwarded straight to
# `from_pretrained` — see htrflow's own trocr.py docstring. A model counts
# as pinned when either path matches the 40-hex pattern. Admission does not
# know which loader a step uses, so a pin in the wrong place for its own
# loader is admitted here and fails later, at load time in the warm-up.
#
# Both paths are only the pin if nothing overrides them (2026-09-17 audit,
# 3058). htrflow's `Inference.from_config` pops `model`, `model_settings`
# and `generation_settings` off a step's `settings` and passes
# `model_settings | <whatever is left>` to the model, so a `revision: null`
# or `model_kwargs: {}` BESIDE `model_settings` wins over the pinned one
# inside it. The second rule refuses any other key under the `settings` of a
# step that loads a model (`settings.model` names the loader) -- the same
# rule the converter's `validate` applies, so the author meets it first in
# the pull request.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: htrflow-batch-model-revision-{{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: pipeline-models-pinned
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [{{ .Release.Namespace | quote }}]
      context:
        - name: unpinned
          variable:
            jmesPath: >-
              parse_yaml(request.object.data."pipeline.yaml" || 'steps: []').steps
              | [?settings.model_settings.model]
              | [?!(regex_match('^[0-9a-f]{40}$', settings.model_settings.revision || '')
              || regex_match('^[0-9a-f]{40}$', settings.model_settings.model_kwargs.revision || ''))].settings.model_settings.model
            default: []
      validate:
        message: >-
          models not pinned to a revision: {{ `{{ join(', ', unpinned) }}` }}
          — add revision: <40-character commit hash> under model_settings
          (YOLO) or model_settings.model_kwargs (TrOCR and other Hugging
          Face models, which also need it under
          model_settings.processor_kwargs)
        deny:
          conditions:
            all:
              - key: {{ `"{{ length(unpinned) }}"` }}
                operator: GreaterThan
                value: 0
    # A Hugging Face model with a processor is two downloads (audit 0923
    # D-6). htrflow's TrOCR, WordLevelTrOCR, Donut and DiT load the model
    # with `model_kwargs` and then the processor -- tokenizer, image
    # processor -- with `processor or model` and `processor_kwargs`, never
    # `model_kwargs`. A pin under model_kwargs alone leaves the processor on
    # the repo's mutable head, so for those loaders processor_kwargs needs
    # its own 40-hex revision. htrflow finds the loader by its lower-cased
    # class name (`get_model_by_name`), and so does this rule. YOLO and
    # PyLaia download one repo with the top-level revision and have no
    # processor.
    - name: pipeline-processors-pinned
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [{{ .Release.Namespace | quote }}]
      context:
        - name: unpinned
          variable:
            jmesPath: >-
              parse_yaml(request.object.data."pipeline.yaml" || 'steps: []').steps
              | [?settings.model_settings.model]
              | [?contains(['trocr', 'wordleveltrocr', 'donut', 'dit'], to_lower(to_string(settings.model)))]
              | [?!regex_match('^[0-9a-f]{40}$', settings.model_settings.processor_kwargs.revision || '')].settings.model_settings.model
            default: []
      validate:
        message: >-
          processors not pinned to a revision: {{ `{{ join(', ', unpinned) }}` }}
          — TrOCR, WordLevelTrOCR, Donut and DiT load their processor
          separately, with model_settings.processor_kwargs: add revision:
          <40-character commit hash> there as well as under model_kwargs
        deny:
          conditions:
            all:
              - key: {{ `"{{ length(unpinned) }}"` }}
                operator: GreaterThan
                value: 0
    - name: pipeline-model-settings-only
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [{{ .Release.Namespace | quote }}]
      context:
        - name: stray
          variable:
            jmesPath: >-
              parse_yaml(request.object.data."pipeline.yaml" || 'steps: []').steps
              | [?settings.model]
              | [?length(keys(settings)[?!contains(['model', 'model_settings', 'generation_settings'], @)]) > `0`]
              | [].join(': ', [step || '?', join(', ', keys(settings)[?!contains(['model', 'model_settings', 'generation_settings'], @)])])
            default: []
      validate:
        message: >-
          settings beside model_settings in a step that loads a model:
          {{ `{{ join('; ', stray) }}` }} — htrflow merges them over
          model_settings, so one there overrides a pinned revision; move
          them under model_settings
        deny:
          conditions:
            all:
              - key: {{ `"{{ length(stray) }}"` }}
                operator: GreaterThan
                value: 0
    # `data."pipeline.yaml"` is the only place the two rules above read
    # (audit 0923 D-7). A ConfigMap carrying the key under `binaryData`
    # instead parsed as `steps: []` and was admitted, while a Job mounting
    # it sees the same file. Nothing the converter renders uses binaryData,
    # so a pipeline ConfigMap (by name) carries none at all, and no
    # ConfigMap carries a binary `pipeline.yaml`.
    - name: pipeline-not-in-binary-data
      match:
        any:
          - resources:
              kinds: [ConfigMap]
              namespaces: [{{ .Release.Namespace | quote }}]
      context:
        - name: hidden
          variable:
            jmesPath: >-
              [contains(keys(request.object.binaryData || `{}`), 'pipeline.yaml'),
              starts_with(request.object.metadata.name || '', 'htr-pipeline-')
              && length(keys(request.object.binaryData || `{}`)) > `0`][?@]
            default: []
      validate:
        message: >-
          a pipeline may not be carried in binaryData, where the revision
          rule cannot read it: put pipeline.yaml under data, and nothing
          under binaryData in an htr-pipeline-* ConfigMap
        deny:
          conditions:
            all:
              - key: {{ `"{{ length(hidden) }}"` }}
                operator: GreaterThan
                value: 0
{{- end }}
