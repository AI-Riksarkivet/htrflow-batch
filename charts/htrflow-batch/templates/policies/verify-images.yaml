{{- if .Values.security.verifyImages.enabled }}
{{- $refs := .Values.security.verifyImages.imageReferences }}
{{- if and (not $refs) .Values.security.policies.enabled }}
  {{- range .Values.security.allowedImageRepos }}{{ $refs = append $refs (printf "%s*" .) }}{{ end }}
{{- end }}
{{- if not $refs }}{{ $refs = list "*" }}{{ end }}
# Supply-chain gate (audit X4/S7): Kyverno refuses any Pod in the release
# namespace whose image is not cosign keyless-signed by the given identity.
# Requires Kyverno ≥ 1.10 with the Pod webhook enabled; cluster-scoped
# object, so a second release in another namespace needs its own name —
# hence the namespace suffix.
#
# Kyverno skips an image outside `imageReferences`, so narrowing them to
# `allowedImageRepos` is only safe while images-allowed refuses everything
# else -- which it does only when `policies.enabled` renders it (2026-09-17
# audit, 3065). Otherwise the default is every image.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: htrflow-batch-verify-images-{{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-cosign-keyless
      match:
        any:
          - resources:
              # A rule on kind Pod does not see the subresource request
              # `kubectl debug` adds an ephemeral container through; the
              # subresource has to be named.
              kinds: [Pod, Pod/ephemeralcontainers]
              namespaces: [{{ .Release.Namespace | quote }}]
      # Kyverno extracts a Pod's container images by itself, but not its
      # image volumes (2026-09-17 audit, 3061) -- and naming ANY extractor
      # for a kind replaces the built-in list for it, so the three container
      # lists are spelt out beside the volume path rather than lost.
      imageExtractors:
        Pod:
          - { name: containers, path: /spec/containers/*, value: image, key: name }
          - { name: initContainers, path: /spec/initContainers/*, value: image, key: name }
          - { name: ephemeralContainers, path: /spec/ephemeralContainers/*, value: image, key: name }
          - { name: imageVolumes, path: /spec/volumes/*/image, value: reference }
      verifyImages:
        - imageReferences: {{ toJson $refs }}
          # What the release writes (audit 0923 D-1): cosign 3 signs into a
          # Sigstore bundle, attached to the image as an OCI referrer, and
          # writes no `sha256-<digest>.sig` tag -- the only place Kyverno's
          # default type (`Cosign`) looks. Under that default no published
          # image had a signature and every pod was refused. The bundle
          # carries its own transparency-log entry; `rekor.url` below is
          # where Kyverno checks it. `dagger call verify-published` runs
          # this rule against the published digests.
          type: SigstoreBundle
          # Digest pinning is the chart's job (requireDigest); do not let the
          # webhook rewrite pod specs on the way in.
          mutateDigest: false
          verifyDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                - keyless:
                    issuer: {{ .Values.security.verifyImages.issuer | quote }}
                    subject: {{ .Values.security.verifyImages.subject | quote }}
                    rekor:
                      url: {{ .Values.security.verifyImages.rekorUrl | quote }}
{{- end }}
