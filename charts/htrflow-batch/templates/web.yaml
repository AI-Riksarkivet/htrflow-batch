# The web front (D8/D19, B63 Task 17): one Deployment serving the campaign
# browser at /, Universal Viewer at /uv.html and the read-only status API at
# /api/v1/jobs[/…] over the Indexed Jobs a campaign renders to
# (packages/web). Everything is computed live from the Kubernetes API —
# there is no status document written anywhere any more.
# Open a volume directly with:
#   http://<node>:{{ .Values.web.nodePort }}/uv.html#?manifest=<PUBLIC_RESULTS_BASE>/<pipeline>/<volume>/iiif.json
# Until Task 17 a separate nginx image served the site and proxied /api/
# here; that image, its ConfigMap and the proxy are gone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
rules:
  # This namespace only (Role, not ClusterRole), and read-only but for one
  # write: the per-campaign status ConfigMap (`campaign-<name>-status`),
  # which this service is the only observer of and which is what still
  # answers for a campaign once its Job is past `ttlSecondsAfterFinished`
  # (B76, docs: how-it-works/campaigns.md). `create` is not a second
  # privilege: a server-side apply of an object that does not exist yet is a
  # create. Nothing here may ever delete, or write a Job or a Pod —
  # packages/web/tests/test_app.py greps the source to keep it that way.
  # No `watch`: every response is computed from a get or a list on the
  # request, and nothing in packages/web opens a watch (2026-09-14 audit).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: htrflow-web
subjects:
  - kind: ServiceAccount
    name: htrflow-web
    namespace: {{ .Release.Namespace }}
---
{{- include "htrflow-batch.requireDigest" (list . .Values.web.image "web.image") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: htrflow-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: htrflow-web }
  template:
    metadata:
      labels: { app: htrflow-web }   # NetworkPolicy selector (network.yaml, this file)
    spec:
      serviceAccountName: htrflow-web
      # The one exception to this chart's "no SA token" pattern (the
      # batch/warm-up Jobs set this false): this pod IS a Kubernetes API
      # client — it needs the token to authenticate get/list/watch calls to
      # the apiserver. Everything else about it is Pod Security restricted.
      automountServiceAccountToken: true
      securityContext:
        {{- include "htrflow-batch.restrictedPod" 1000 | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.web.image }}
          imagePullPolicy: {{ include "htrflow-batch.pullPolicy" .Values.web.image }}
          securityContext:
            {{- include "htrflow-batch.restrictedContainer" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: HTRFLOW_PUBLIC_RESULTS_BASE
              value: {{ .Values.publicResultsBase | required "publicResultsBase is required (the read API serves S3 links built from it)" | quote }}
            # Where THIS POD reaches the bucket for progress.json -- not
            # necessarily the same address as the one above: on the PoC,
            # publicResultsBase is a `localhost` URL reached through an SSH
            # forward, which the pod itself cannot resolve to anything but
            # itself (docs: development/local-k3s, "Two S3 endpoints").
            # Defaults to publicResultsBase, which is correct on real AWS.
            - name: HTRFLOW_INTERNAL_RESULTS_BASE
              value: {{ .Values.web.internalResultsBase | default .Values.publicResultsBase | quote }}
            # The API acts on its own namespace; the downward API keeps it
            # correct whatever --namespace the release uses. Deliberately
            # single-valued today (one namespace, this release's) — the
            # comma-separated list packages/web/src/htrflow_web/kube.py
            # already parses is for a future multi-tenant deployment, not
            # anything this chart wires up yet.
            - name: HTRFLOW_NAMESPACES
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: htrflow-web
spec:
  # The browser's way in (audit S4 headers are sent by the app itself now).
  type: NodePort
  # Local, not the default Cluster: under Cluster a connection that lands on
  # a node without the pod is forwarded AND SNAT'd to that node's address,
  # so the pod -- and its NetworkPolicy -- never sees the client, and
  # network.web.ingressCidrs could only ever match nodes (finding 3064).
  # Local keeps the client's address. The price: only the node running the
  # pod answers on the NodePort; the others drop the connection.
  externalTrafficPolicy: Local
  selector: { app: htrflow-web }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: {{ .Values.web.nodePort }}
{{- if .Values.network.enabled }}
---
{{- /*
Same S3 egress as the batch Job's own policy (network.yaml's `$s3` -- a
separate template file, so it cannot share that file's local variable):
this pod's ProgressReader (HTRFLOW_INTERNAL_RESULTS_BASE below) has to reach
the bucket too, on the PoC's in-namespace `app: rustfs` pod or a real
endpoint from network.s3Cidrs.
*/}}
{{- $s3 := list (dict "to" (list (dict "podSelector" (dict "matchLabels" (dict "app" "rustfs")))) "ports" (list (dict "port" 9000))) }}
{{- if .Values.network.s3Cidrs }}
  {{- $blocks := list }}
  {{- range .Values.network.s3Cidrs }}{{ $blocks = append $blocks (dict "ipBlock" (dict "cidr" .)) }}{{ end }}
  {{- /* Named ports, not the whole range (2026-09-14, audit): a
       self-hosted endpoint's CIDR is a slice of the operator's own
       network, and this rule used to open every port of it. */}}
  {{- $s3Ports := list }}
  {{- range .Values.network.s3Ports }}{{ $s3Ports = append $s3Ports (dict "port" .) }}{{ end }}
  {{- $s3 = append $s3 (dict "to" $blocks "ports" $s3Ports) }}
{{- end }}
# Web front: browsers in, matched on their own addresses (the Service's
# externalTrafficPolicy: Local keeps them un-SNAT'd); egress to DNS, the
# apiserver, and S3 -- this pod's own ProgressReader reads progress.json out
# of the results bucket (docs: s3-layout); everything else it links to is
# fetched by the browser, not by this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-web }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- /* Empty only with allowPublicIngress (the guard in _helpers.tpl):
             spell the catch-all out rather than render a bare `from:`. */}}
        {{- range (.Values.network.web.ingressCidrs | default (list "0.0.0.0/0")) }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { port: 8081 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - {{ include "htrflow-batch.apiServerEgress" . }}
    {{- range $s3 }}
    - {{ toJson . }}
    {{- end }}
{{- end }}
