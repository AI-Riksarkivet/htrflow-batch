# The web front (D8/D19, B63 Task 17): one Deployment serving the campaign
# browser at /, Universal Viewer at /uv.html and the read-only status API at
# /api/v1/jobs[/…] over the Indexed Jobs a campaign renders to
# (packages/web). Everything is computed live from the Kubernetes API —
# there is no status document written anywhere any more.
# Open a volume directly with:
#   http://<node>:{{ .Values.web.nodePort }}/uv.html#?manifest=<PUBLIC_RESULTS_BASE>/<pipeline>/<volume>/iiif.json
# Until Task 17 an nginx image (uv4-viewer) served the site and proxied
# /api/ here; the image, its ConfigMap and the proxy are gone.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
rules:
  # Read-only, this namespace only (Role, not ClusterRole) — the API never
  # creates, updates or deletes anything (packages/web/src/htrflow_web/kube.py).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: htrflow-web
subjects:
  - kind: ServiceAccount
    name: htrflow-web
    namespace: {{ .Release.Namespace }}
---
{{- include "htrflow-batch.requireDigest" (list . .Values.web.image "web.image") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: htrflow-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: htrflow-web }
  template:
    metadata:
      labels: { app: htrflow-web }   # NetworkPolicy selector (network.yaml, this file)
    spec:
      serviceAccountName: htrflow-web
      # The one exception to this chart's "no SA token" pattern (the
      # batch/warm-up Jobs set this false): this pod IS a Kubernetes API
      # client — it needs the token to authenticate get/list/watch calls to
      # the apiserver. Everything else about it is Pod Security restricted.
      automountServiceAccountToken: true
      securityContext:
        {{- include "htrflow-batch.restrictedPod" 1000 | nindent 8 }}
      containers:
        - name: web
          image: {{ .Values.web.image }}
          imagePullPolicy: {{ include "htrflow-batch.pullPolicy" .Values.web.image }}
          securityContext:
            {{- include "htrflow-batch.restrictedContainer" . | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: HTRFLOW_PUBLIC_RESULTS_BASE
              value: {{ .Values.publicResultsBase | required "publicResultsBase is required (the read API serves S3 links built from it)" | quote }}
            # The API acts on its own namespace; the downward API keeps it
            # correct whatever --namespace the release uses. Deliberately
            # single-valued today (one namespace, this release's) — the
            # comma-separated list packages/web/src/htrflow_web/kube.py
            # already parses is for a future multi-tenant deployment, not
            # anything this chart wires up yet.
            - name: HTRFLOW_NAMESPACES
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: htrflow-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
    app: htrflow-web
spec:
  # The browser's way in (audit S4 headers are sent by the app itself now).
  type: NodePort
  selector: { app: htrflow-web }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: {{ .Values.web.nodePort }}
{{- if .Values.network.enabled }}
---
{{- /*
Same apiserver-CIDR auto-detection as network.yaml (a separate template
file, so it cannot share that file's local variables): the endpoint kube-
router matches egress against AFTER service DNAT.
*/}}
{{- $api := .Values.network.apiServer.cidr }}
{{- if not $api }}
  {{- with (lookup "v1" "Endpoints" "default" "kubernetes") }}
    {{- with (index .subsets 0) }}{{ $api = printf "%s/32" (index .addresses 0).ip }}{{ end }}
  {{- end }}
{{- end }}
# Web front: browsers in (NodePort traffic arrives SNAT'd from the node, so
# the node range must be in network.web.ingressCidrs); egress to DNS and the
# apiserver only — it never touches S3 or anything else in-cluster, and the
# results it links to are fetched by the browser, not by this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: htr-web
  namespace: {{ .Release.Namespace }}
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app: htrflow-web }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.network.web.ingressCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { port: 8081 }
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    {{- if $api }}
    - to:
        - ipBlock: { cidr: {{ $api | quote }} }
      ports:
        - { port: {{ .Values.network.apiServer.port }} }
    {{- else }}
    {{- fail "network.apiServer.cidr is required when the kube-apiserver endpoint cannot be looked up (helm template / no RBAC)" }}
    {{- end }}
{{- end }}
