{{- if .Values.devStack.registry.enabled }}
# In-cluster image registry for iterating on the htrflow-batch image.
# Push from host:  kubectl -n registry port-forward svc/registry {{ .Values.devStack.registry.nodePort }}:5000 &
#                  docker push 127.0.0.1:{{ .Values.devStack.registry.nodePort }}/<image>
# Pull from k3s:   /etc/rancher/k3s/registries.yaml maps 127.0.0.1:{{ .Values.devStack.registry.nodePort }} ->
#                  http://<node-ip>:{{ .Values.devStack.registry.nodePort }} (NodePort), pods use 127.0.0.1:{{ .Values.devStack.registry.nodePort }}/<image>
#
# NOTE: this registry deliberately lives in its own `registry` namespace, not
# {{ .Release.Namespace }} — it's a PoC-only iteration aid shared across whatever
# is being pushed, not part of the htrflow-batch release proper. The name is
# hardcoded rather than templated for that reason.
apiVersion: v1
kind: Namespace
metadata:
  name: registry
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: registry
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 60Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels: {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: {{ .Values.devStack.registry.nodePort }}
{{- end }}
