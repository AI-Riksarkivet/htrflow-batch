{{- if .Values.reconciler.enabled }}
{{- include "htrflow-batch.requireDigest" (list . .Values.reconciler.image "reconciler.image") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: htr-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "htrflow-batch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: htr-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "htrflow-batch.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Per-tick Lease (audit O8): a manual `kubectl create job --from=cronjob`
  # bypasses concurrencyPolicy Forbid; the Lease is what actually serialises
  # ticks. `create` cannot be scoped by name; get/update are.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["htr-reconciler"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: htr-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "htrflow-batch.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: htr-reconciler
subjects:
  - kind: ServiceAccount
    name: htr-reconciler
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: htr-reconciler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "htrflow-batch.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.reconciler.schedule | quote }}
  concurrencyPolicy: Forbid
  # A tick that cannot start within two minutes of its slot (controller
  # restart, apiserver hiccup) is skipped rather than counted as 100 misses
  # and suspending the CronJob (audit O7).
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # ≥ the reconciler's git clone timeout; a deadline-killed tick submits
      # nothing and writes nothing, so this must never be the common case.
      activeDeadlineSeconds: {{ .Values.reconciler.tickDeadlineSeconds }}
      # A hard-failing tick must not burn six pods before the next schedule:
      # concurrencyPolicy Forbid already serialises ticks, and the next one
      # picks up wherever this one stopped.
      backoffLimit: 0
      template:
        metadata:
          labels: { app: htr-reconciler }   # NetworkPolicy selector (network.yaml)
        spec:
          serviceAccountName: htr-reconciler
          # The one pod that legitimately holds an API credential: it creates
          # Jobs. Everything else about it is Pod Security restricted (D14).
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            {{- include "htrflow-batch.restrictedPod" 1000 | nindent 12 }}
          containers:
            - name: reconciler
              image: {{ .Values.reconciler.image | required "reconciler.image is required when reconciler.enabled" }}
              imagePullPolicy: {{ include "htrflow-batch.pullPolicy" .Values.reconciler.image }}
              securityContext:
                {{- include "htrflow-batch.restrictedContainer" . | nindent 16 }}
              env:
                # Read-only root: the campaigns clone (tempfile.gettempdir())
                # and git's HOME both land on the /tmp emptyDir.
                - name: HOME
                  value: /tmp
                - name: AWS_SHARED_CREDENTIALS_FILE
                  value: /secrets/s3/credentials
                - name: S3_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: S3_ENDPOINT, optional: true }
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef: { name: {{ .Values.s3.existingSecret }}, key: S3_BUCKET }
                - name: CAMPAIGNS_REPO_URL
                  value: {{ .Values.reconciler.campaignsRepoUrl | required "reconciler.campaignsRepoUrl is required" | quote }}
                {{- if .Values.reconciler.campaignsRepoWebUrl }}
                - name: CAMPAIGNS_REPO_WEB_URL
                  value: {{ .Values.reconciler.campaignsRepoWebUrl | quote }}
                {{- end }}
                - name: PUBLIC_RESULTS_BASE
                  value: {{ .Values.reconciler.publicResultsBase | default .Values.publicResultsBase | required "publicResultsBase (or reconciler.publicResultsBase) is required when reconciler.enabled" | quote }}
                # The reconciler acts on its own namespace; the downward API
                # keeps it correct whatever --namespace the release uses.
                - name: RECONCILER_NAMESPACE
                  valueFrom:
                    fieldRef: { fieldPath: metadata.namespace }
                - name: RECONCILER_QUEUE
                  value: {{ .Values.queue.name | quote }}
                - name: RECONCILER_S3_SECRET
                  value: {{ .Values.s3.existingSecret | quote }}
                - name: RECONCILER_DATA_PVC
                  value: {{ .Values.modelCache.name | quote }}
                - name: RECONCILER_WINDOW
                  value: {{ .Values.reconciler.window | int64 | quote }}
                - name: RECONCILER_ATTEMPT_CAP
                  value: {{ .Values.reconciler.attemptCap | int64 | quote }}
                # Contract (plan 2026-08-26): tick cadence, bounded work per
                # tick, the Job placement/deadline knobs, the trust boundary.
                - name: RECONCILER_TICK_SECONDS
                  value: {{ .Values.reconciler.tickSeconds | int64 | quote }}
                - name: RECONCILER_TICK_DEADLINE_SECONDS
                  value: {{ .Values.reconciler.tickDeadlineSeconds | int64 | quote }}
                - name: RECONCILER_GIT_TIMEOUT
                  value: {{ .Values.reconciler.gitTimeoutSeconds | int64 | quote }}
                {{- with .Values.reconciler.gitTokenSecret }}
                {{- if .name }}
                # Read-only token for an https:// campaigns URL (dulwich sends it
                # as x-access-token); never put it in campaignsRepoUrl.
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .name | quote }}
                      key: {{ .key | default "token" | quote }}
                {{- end }}
                {{- end }}
                - name: RECONCILER_MAX_VALIDATIONS_PER_TICK
                  value: {{ .Values.reconciler.maxValidationsPerTick | int64 | quote }}
                - name: RECONCILER_FETCH_MAX_BYTES
                  value: {{ .Values.reconciler.fetchMaxBytes | int64 | quote }}
                - name: RECONCILER_LEASE_NAME
                  value: htr-reconciler
                - name: RECONCILER_JOB_MIN_DEADLINE_SECONDS
                  value: {{ .Values.job.minDeadlineSeconds | int64 | quote }}
                - name: RECONCILER_JOB_SECONDS_PER_PAGE
                  value: {{ .Values.job.secondsPerPage | int64 | quote }}
                - name: RECONCILER_JOB_MANIFEST_MAX_BYTES
                  value: {{ .Values.job.manifestMaxBytes | int64 | quote }}
                - name: RECONCILER_JOB_FETCH_MAX_BYTES
                  value: {{ .Values.job.fetchMaxBytes | int64 | quote }}
                - name: RECONCILER_JOB_RUNTIME_CLASS
                  value: {{ .Values.job.runtimeClassName | quote }}
                - name: RECONCILER_JOB_NODE_SELECTOR
                  value: {{ .Values.job.nodeSelector | toJson | quote }}
                - name: RECONCILER_JOB_TOLERATIONS
                  value: {{ .Values.job.tolerations | toJson | quote }}
                - name: RECONCILER_ALLOWED_IMAGE_REPOS
                  value: {{ .Values.security.allowedImageRepos | join "," | quote }}
                - name: RECONCILER_REQUIRE_MODEL_REVISION
                  value: {{ .Values.security.requireModelRevision | ternary "true" "false" | quote }}
              volumeMounts:
                - { name: s3, mountPath: /secrets/s3, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 512Mi }
          volumes:
            - name: s3
              secret: { secretName: {{ .Values.s3.existingSecret }}, defaultMode: 0440 }
            - name: tmp
              emptyDir: { sizeLimit: 1Gi }
{{- end }}
