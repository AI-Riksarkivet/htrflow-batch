# Every optional feature on, for `helm lint -f` / `helm template -f` /
# kubeconform in CI. No cluster is needed: the apiserver CIDR and node CIDRs
# are given explicitly so no Helm `lookup` is required.
publicResultsBase: http://localhost:30900/htr-results

modelCache:
  create: true
  storageClass: local-path

web:
  image: 127.0.0.1:30500/htrflow-web@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  nodePort: 30800
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 256Mi }

apply:
  rbac:
    enabled: true

security:
  allowedImageRepos: ["127.0.0.1:30500/", "ghcr.io/riksarkivet/"]
  requireModelRevision: true
  policies:
    enabled: true
  psaEnforce: restricted
  allowTagImages: false
  verifyImages:
    enabled: true
    issuer: https://token.actions.githubusercontent.com
    subject: https://github.com/AI-Riksarkivet/htrflow-batch/.github/workflows/publish.yml@refs/heads/main

network:
  # This file is a render fixture, not an install: it keeps the catch-all
  # default and says so, which is also what exercises the opt-out.
  web:
    allowPublicIngress: true
  iiifCidrs: ["203.0.113.27/32"]
  nodeCidrs: ["192.0.2.56/32"]
  apiServer:
    cidr: 192.0.2.56/32
  s3Cidrs: ["10.0.0.5/32"]

# Two sorts of GPU, each its own ResourceFlavor and quota (B104), so the
# flavor list is rendered and checked against Kueue's CRD schemas. The
# cheaper card first: Kueue tries flavors in order, and a pod that names no
# flavor takes the first with room.
queue:
  flavors:
    - name: small-gpu
      nodeLabels: { nvidia.com/gpu.product: NVIDIA-L4 }
      quota: { cpu: 8, memory: 32Gi, nvidia.com/gpu: 4 }
    - name: large-gpu
      nodeLabels: { nvidia.com/gpu.product: NVIDIA-A100-SXM4-80GB }
      nodeTaints: [{ key: gpu-pool, value: large, effect: NoSchedule }]
      quota: { cpu: 16, memory: 128Gi, nvidia.com/gpu: 2 }
