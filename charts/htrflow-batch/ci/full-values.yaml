# Every optional feature on, for `helm lint -f` / `helm template -f` /
# kubeconform in CI. No cluster is needed: the apiserver CIDR and node CIDRs
# are given explicitly so no Helm `lookup` is required.
publicResultsBase: http://localhost:30900/htr-results

modelCache:
  create: true
  storageClass: local-path

api:
  image: 127.0.0.1:30500/htrflow-api@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 256Mi }

security:
  allowedImageRepos: ["127.0.0.1:30500/", "ghcr.io/riksarkivet/"]
  requireModelRevision: true
  psaEnforce: restricted
  allowTagImages: false
  verifyImages:
    enabled: true
    issuer: https://token.actions.githubusercontent.com
    subject: https://github.com/Riksarkivet/htrflow-batch/.github/workflows/publish.yml@refs/tags/*

network:
  nodeCidrs: ["10.16.51.56/32"]
  apiServer:
    cidr: 10.16.51.56/32
  s3Cidrs: ["10.0.0.5/32"]

viewer:
  image: 127.0.0.1:30500/uv4@sha256:11a3a359c47bfadf0d6a11e5031024b21befa20595e812e3d786b8ff27d29e25
  defaultManifest: http://localhost:30900/htr-results/demo-v1/mock-vol/iiif.json
