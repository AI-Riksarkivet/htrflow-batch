# The profile a production install starts from
# (docs/getting-started/deploy.md). `values.yaml` calls itself
# production-shaped, but it ships every enforcement point OFF — a policy
# nothing reconciles is worse than no policy, and that is the right default
# for a chart whose first user has no Kyverno. It is the wrong default for a
# cluster that does, and the gap between "the repository built this" and "the
# installation enforces it" was the whole of it.
#
# This file is only the switches. What it deliberately does NOT set is
# everything one cluster cannot know for another — `publicResultsBase`, the
# web image digest, `network.apiServer.cidr`, `network.clusterCidrs`,
# `network.iiifCidrs`, `network.s3Cidrs` and who may reach the web front.
# A render with this file alone fails asking for them, which is the point:
# a guessed value would be wrong on every cluster and look right on none.
#
#   helm install htr charts/htrflow-batch -n <namespace> --create-namespace \
#     -f charts/htrflow-batch/values-prod.yaml --set …
#   make psa-labels     # Helm cannot label a namespace it did not create
#
# Pod Security is the one line here that Helm does not apply by itself:
# `psaEnforce` is read by `make psa-labels`, which the install page already
# says to run. The platform's own pods and the Jobs the converter renders are
# restricted-clean, so `restricted` is a level they actually meet.

security:
  # Only what the release publishes: the three repositories by name, not
  # the organisation, whose every future repository an org-wide prefix
  # would admit too. Add your own repository if you build the web image or
  # a pipeline image yourself.
  allowedImageRepos:
    - docker.io/riksarkivet/htrflow-batch
    - docker.io/riksarkivet/htrflow-web
    - docker.io/riksarkivet/htrflow-campaigns
  # Hugging Face weights are pickles and a repo id alone is mutable.
  requireModelRevision: true
  policies:
    enabled: true
  psaEnforce: restricted
  allowTagImages: false
  verifyImages:
    enabled: true
    issuer: https://token.actions.githubusercontent.com
    # The identity the publish workflow signs as. Publishing is a manual
    # dispatch, so the certificate carries the branch it ran from, never a
    # tag ref. Change this to your own workflow if you republish the images.
    subject: https://github.com/AI-Riksarkivet/htrflow-batch/.github/workflows/publish.yml@refs/heads/main
