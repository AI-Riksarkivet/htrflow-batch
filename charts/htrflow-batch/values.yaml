# Default values: production-shaped. The k3s PoC replay overrides are shown in
# docs getting-started (devStack.* true, image from the in-cluster registry).
image:
  repository: docker.io/riksarkivet/htrflow-batch
  tag: latest

s3:
  # endpoint is currently INFORMATIONAL: no template references it. The
  # reconciler and the Jobs get the endpoint from existingSecret via envFrom —
  # set S3_ENDPOINT there, not here.
  endpoint: ""            # in-cluster S3 endpoint URL; empty = provider default chain
  bucket: htr-results     # used by the devStack RustFS secret only

  # keys: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_ENDPOINT, S3_BUCKET
  # (reconciler + jobs read all four via envFrom; omit S3_ENDPOINT only for
  # real AWS)
  existingSecret: htr-batch-s3

publicResultsBase: ""      # browser-reachable URL base for published results (REQUIRED for viewer manifests)

queue:
  name: htr-batch
  flavor: default-flavor
  # Covered resources and quotas for the ClusterQueue. EVERY resource a Job
  # requests must be covered or Kueue marks it inadmissible. PoC gates GPUs
  # via cpu quota (see decision D2); real clusters add nvidia.com/gpu here.
  resources:
    - name: cpu
      quota: 2
    - name: memory
      quota: 4Gi

pipelines:
  # id -> htrflow pipeline YAML (string). Rendered as immutable ConfigMap
  # htr-pipeline-<id>. NEVER change content under an existing id (D17).
  {}

viewer:                    # campaign browser at /, UV4 at /uv.html
  enabled: true
  image: docker.io/riksarkivet/htrflow-batch-viewer:latest
  nodePort: 30800
  defaultManifest: ""      # DEPRECATED: when set, / redirects to UV instead of the campaign browser

devStack:                  # PoC-only in-cluster dependencies, all off by default
  rustfs:
    enabled: false
    nodePortS3: 30900
    nodePortConsole: 30901
  registry:
    enabled: false
    nodePort: 30500
  nvidiaDevicePlugin:
    enabled: false

reconciler:                # GitOps campaign reconciler (spec: campaign-gitops)
  enabled: false
  image: ""                # e.g. 127.0.0.1:30500/htrflow-reconciler:dev on the PoC
  campaignsRepoUrl: ""     # e.g. https://github.com/<org>/htr-campaigns
  campaignsRepoWebUrl: ""   # browsable URL shown on the status page; falls back to campaignsRepoUrl
  schedule: "*/5 * * * *"
  window: 20               # max not-yet-done Jobs existing at once
  attemptCap: 3
  publicResultsBase: ""    # defaults to global publicResultsBase

exampleJob:
  enabled: false           # mock-vol smoke Job wired to the devStack endpoints
  image: ""                # e.g. 127.0.0.1:30500/htrflow-batch:v3 on the PoC
  manifestUrl: ""
  pipelineId: demo-v1
